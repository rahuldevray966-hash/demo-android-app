name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ==========================================================
  # STAGE 1
  # Firebase Authentication
  # ==========================================================

  stage-1-firebase-auth:

    name: Stage 1 - Firebase Authentication

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Verify Firebase authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Firebase Authentication"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase authentication failed"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "Firebase authentication successful"


  # ==========================================================
  # STAGE 2
  # Get Firebase Release
  # ==========================================================

  stage-2-firebase-release:

    name: Stage 2 - Get Firebase Release

    needs:
      - stage-1-firebase-auth

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Get latest Firebase release

        id: firebase-release

        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"

          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain numbers only"
            exit 1
          fi

          if [[ "$APP_ID" != *":ios:"* && "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID format looks incorrect"
            exit 1
          fi

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Firebase returned invalid JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase release found"

            echo "Firebase response:"
            cat firebase-release.json

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Firebase release found"
          echo "=========================================="

          echo "Release:"
          echo "$RELEASE_NAME"

          echo "Firebase download URL found"

      - name: Upload Firebase release information
        uses: actions/upload-artifact@v4

        with:
          name: firebase-release-info

          path: firebase-release.json


  # ==========================================================
  # STAGE 3
  # Download Existing Firebase APK
  # ==========================================================

  stage-3-download-apk:

    name: Stage 3 - Download Existing Firebase APK

    needs:
      - stage-2-firebase-release

    runs-on: ubuntu-latest

    steps:

      - name: Download Firebase release information
        uses: actions/download-artifact@v4

        with:
          name: firebase-release-info

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2

        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Download existing Firebase APK

        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading Existing Firebase APK"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"

          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase APK download URL not found"
            exit 1
          fi

          echo "Downloading APK..."

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          echo ""
          echo "APK downloaded successfully"

          ls -lh firebase-app.apk

      - name: Verify APK

        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful"

      - name: Upload APK artifact

        uses: actions/upload-artifact@v4

        with:
          name: firebase-apk

          path: firebase-app.apk


  # ==========================================================
  # STAGE 4
  # pCloudy Authentication + Device List
  # ==========================================================

  stage-4-pcloudy-auth:

    name: Stage 4 - pCloudy Authentication

    needs:
      - stage-3-download-apk

    runs-on: ubuntu-latest

    steps:

      - name: Authenticate and get pCloudy device list

        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "pCloudy Authentication"
          echo "=========================================="

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            printf '%s' "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            echo "$AUTH_RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "pCloudy authentication successful"

          echo ""
          echo "=========================================="
          echo "Getting available Android devices"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Available Android devices"
          echo "=========================================="

          jq -r '
            .. |
            objects |
            select(.full_name? != null) |
            "\(.full_name) | available=\(.available)"
          ' pcloudy-devices.json 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "Selecting Galaxy S25"
          echo "=========================================="

          SELECTED_DEVICE="$(
            jq -r '
              .. |
              objects |
              select(
                .full_name? != null
                and
                (.full_name | test("GalaxyS25"; "i"))
                and
                (.available == true)
              ) |
              .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"

          if [ -z "$SELECTED_DEVICE" ]; then
            echo "ERROR: No available Galaxy S25 found"

            echo ""
            echo "Available devices:"
            jq -r '
              .. |
              objects |
              select(.full_name? != null) |
              .full_name
            ' pcloudy-devices.json 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Selected device:"
          echo "$SELECTED_DEVICE"

          printf 'PCLOUDY_DEVICE=%s\n' "$SELECTED_DEVICE" > selected-device.env

      - name: Upload pCloudy device information

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-device-info

          path: |
            pcloudy-devices.json
            selected-device.env


  # ==========================================================
  # STAGE 5
  # Upload APK to pCloudy
  # ==========================================================

  stage-5-upload-apk:

    name: Stage 5 - Upload APK to pCloudy

    needs:
      - stage-4-pcloudy-auth

    runs-on: ubuntu-latest

    steps:

      - name: Download Firebase APK

        uses: actions/download-artifact@v4

        with:
          name: firebase-apk

      - name: Authenticate with pCloudy and upload APK

        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading APK to pCloudy"
          echo "=========================================="

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: firebase-app.apk not found"
            exit 1
          fi

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            printf '%s' "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "pCloudy authentication successful"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy APK upload failed"

            cat pcloudy-upload.json

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK uploaded to pCloudy successfully"
          echo "=========================================="

      - name: Upload pCloudy upload response

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-upload-result

          path: pcloudy-upload.json

          if-no-files-found: warn


  # ==========================================================
  # STAGE 6
  # Appium Galaxy S25
  # ==========================================================

  stage-6-appium:

    name: Stage 6 - Appium Galaxy S25

    needs:
      - stage-5-upload-apk

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code

        uses: actions/checkout@v4

      - name: Download pCloudy device information

        uses: actions/download-artifact@v4

        with:
          name: pcloudy-device-info

      - name: Read selected device

        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Selected pCloudy device"
          echo "=========================================="

          cat selected-device.env

          source selected-device.env

          echo "Device: $PCLOUDY_DEVICE"

      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"

      - name: Install Appium dependencies

        shell: bash

        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              Appium-Python-Client \
              selenium \
              pytest \
              pytest-html
          fi

          echo "Appium dependencies installed successfully"

      - name: Run Appium lifecycle test

        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          APP_PACKAGE: com.epam.mobitru

          PCLOUDY_APPLICATION_NAME: firebase-app.apk

        run: |
          set -euo pipefail

          source selected-device.env

          echo ""
          echo "=========================================="
          echo "Starting Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"
          echo "App    : $PCLOUDY_APPLICATION_NAME"

          echo "=========================================="

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml

          echo ""
          echo "=========================================="
          echo "APP LIFECYCLE TEST PASSED"
          echo "=========================================="

      - name: Upload Appium test results

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: appium-test-results-galaxy-s25

          path: |
            appium-results.xml
            selected-device.env

          if-no-files-found: warn
