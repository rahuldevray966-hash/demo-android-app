name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ==================================================
  # STAGE 1
  # Firebase Authentication
  # ==================================================

  firebase-auth:

    name: Stage 1 - Firebase Authentication

    runs-on: ubuntu-latest

    steps:

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Verify Firebase authentication
        run: |
          set -e

          echo "=========================================="
          echo "STAGE 1 - Firebase Authentication"
          echo "=========================================="

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase authentication failed"
            exit 1
          fi

          echo "Firebase authentication successful"


  # ==================================================
  # STAGE 2
  # Get Firebase Release
  # ==================================================

  firebase-release:

    name: Stage 2 - Get Firebase Release

    runs-on: ubuntu-latest

    needs:
      - firebase-auth

    steps:

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      - name: Get latest Firebase release

        id: firebase-release

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

        run: |

          set -e

          echo "=========================================="
          echo "STAGE 2 - Getting Firebase Release"
          echo "=========================================="

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must be numeric"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE=$(curl \
            -sS \
            --fail-with-body \
            --get \
            --url "$API_URL" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "pageSize=1" \
            --data-urlencode "orderBy=createTime desc")

          echo "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri // empty')

          RELEASE_NAME=$(echo "$RESPONSE" | jq -r '.releases[0].name // empty')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase release not found"
            cat firebase-release.json
            exit 1
          fi

          echo "Firebase release found"
          echo "Release: $RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      - name: Upload Firebase release information

        uses: actions/upload-artifact@v4

        with:
          name: firebase-release-info

          path: firebase-release.json


  # ==================================================
  # STAGE 3
  # Download Existing APK
  # ==================================================

  download-app:

    name: Stage 3 - Download Existing Firebase APK

    runs-on: ubuntu-latest

    needs:
      - firebase-release

    steps:

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      - name: Download latest APK

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

        run: |

          set -e

          echo "=========================================="
          echo "STAGE 3 - Downloading Existing APK"
          echo "=========================================="

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases"

          RESPONSE=$(curl \
            -sS \
            --fail-with-body \
            --get \
            --url "$API_URL" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            --data-urlencode "pageSize=1" \
            --data-urlencode "orderBy=createTime desc")

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri // empty')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase APK URL not found"
            exit 1
          fi

          curl \
            -fL \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            -o firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          echo "APK downloaded successfully"

          ls -lh firebase-app.apk


      - name: Upload APK artifact

        uses: actions/upload-artifact@v4

        with:
          name: firebase-app

          path: firebase-app.apk


  # ==================================================
  # STAGE 4
  # pCloudy Authentication
  # ==================================================

  pcloudy-auth:

    name: Stage 4 - pCloudy Authentication

    runs-on: ubuntu-latest

    needs:
      - download-app

    steps:

      - name: Authenticate with pCloudy

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo "STAGE 4 - pCloudy Authentication"
          echo "=========================================="

          RESPONSE=$(curl \
            -sS \
            --fail-with-body \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          TOKEN=$(echo "$RESPONSE" | jq -r '.result.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "pCloudy authentication successful"


  # ==================================================
  # STAGE 5
  # Upload APK to pCloudy
  # ==================================================

  pcloudy-upload:

    name: Stage 5 - Upload APK to pCloudy

    runs-on: ubuntu-latest

    needs:
      - pcloudy-auth

    steps:

      - name: Download APK artifact

        uses: actions/download-artifact@v4

        with:
          name: firebase-app
          path: .


      - name: Upload APK to pCloudy

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -e

          echo "=========================================="
          echo "STAGE 5 - Uploading APK to pCloudy"
          echo "=========================================="

          RESPONSE=$(curl \
            -sS \
            --fail-with-body \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          TOKEN=$(echo "$RESPONSE" | jq -r '.result.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not get pCloudy token"
            exit 1
          fi

          HTTP_CODE=$(curl \
            -sS \
            -o pcloudy-upload.json \
            -w "%{http_code}" \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${TOKEN}" \
            -F "filter=all" \
            "https://device.pcloudy.com/api/upload_file")

          echo "pCloudy upload HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "APK uploaded to pCloudy successfully"


      - name: Upload pCloudy upload response

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-upload-result

          path: pcloudy-upload.json


  # ==================================================
  # STAGE 6
  # Appium Test - Galaxy S25
  # ==================================================

  appium-test:

    name: Stage 6 - Appium Galaxy S25

    runs-on: ubuntu-latest

    needs:
      - pcloudy-upload

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install Appium dependencies

        run: |

          set -e

          echo "=========================================="
          echo "Installing Appium dependencies"
          echo "=========================================="

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Run Appium lifecycle test

        env:

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          PCLOUDY_DEVICE: Samsung_GalaxyS25_Android_15.0.0_d9af3

          APP_PACKAGE: com.epam.mobitru

        run: |

          set -e

          echo "=========================================="
          echo "STAGE 6 - Appium Lifecycle Test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"

          echo "=========================================="

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml

          echo ""
          echo "=========================================="
          echo "Appium lifecycle test PASSED"
          echo "=========================================="


      - name: Upload Appium results

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: appium-test-results-galaxy-s25

          path: |
            appium-results.xml

          if-no-files-found: warn
