name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  appium-pcloudy:

    name: Firebase → pCloudy → Device → Appium

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # STAGE 1 - FIREBASE
      # Auth → Token → Latest Release → Download → Verify
      # ============================================================

      - name: STAGE 1 - Firebase
        id: firebase
        shell: bash

        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 1 - FIREBASE"
          echo "=========================================="

          # ----------------------------------------------------------
          # Firebase Authentication
          # ----------------------------------------------------------

          echo ""
          echo "[1/5] Authenticating with Firebase..."

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebase-service-account.json

          gcloud auth activate-service-account \
            --key-file=firebase-service-account.json

          echo "Firebase authentication successful"


          # ----------------------------------------------------------
          # Firebase Access Token
          # ----------------------------------------------------------

          echo ""
          echo "[2/5] Getting Firebase access token..."

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "Firebase access token generated"


          # ----------------------------------------------------------
          # Validate Firebase configuration
          # ----------------------------------------------------------

          echo ""
          echo "[3/5] Validating Firebase configuration..."

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID is not an Android Firebase App ID"
            echo "Received: $APP_ID"
            exit 1
          fi

          echo "Firebase configuration validated"


          # ----------------------------------------------------------
          # Get latest Firebase release
          # ----------------------------------------------------------

          echo ""
          echo "[4/5] Getting latest Firebase release..."

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Firebase returned invalid JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase release found"
            cat firebase-release.json
            exit 1
          fi

          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"


          # ----------------------------------------------------------
          # Download APK
          # ----------------------------------------------------------

          echo ""
          echo "[5/5] Downloading APK from Firebase..."

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          echo "APK downloaded successfully"

          ls -lh firebase-app.apk


          # ----------------------------------------------------------
          # Verify APK
          # ----------------------------------------------------------

          echo ""
          echo "Verifying APK..."

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"
          echo "APK verification successful"


          # Cleanup Firebase credentials
          rm -f firebase-service-account.json

          echo ""
          echo "=========================================="
          echo "STAGE 1 - FIREBASE COMPLETED"
          echo "=========================================="


      # ============================================================
      # STAGE 2 - pCLOUDY AUTHENTICATION
      # ============================================================

      - name: STAGE 2 - pCloudy Authentication
        id: pcloudy-auth
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 2 - pCLOUDY AUTHENTICATION"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"

          echo ""
          echo "=========================================="
          echo "STAGE 2 COMPLETED"
          echo "=========================================="


      # ============================================================
      # STAGE 3 - pCLOUDY DEVICE LIST
      # ============================================================

      - name: STAGE 3 - Get pCloudy Device List
        id: device-list
        shell: bash

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 3 - pCLOUDY DEVICE LIST"
          echo "=========================================="

          if [ -z "$PCLOUDY_TOKEN" ]; then
            echo "ERROR: pCloudy token is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${PCLOUDY_TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "AVAILABLE ANDROID DEVICES"
          echo "=========================================="

          jq -r '
            .result.models[]?
            | select(.available == true)
            | select((.platform // "" | ascii_downcase) == "android")
            | "\(.full_name) | \(.display_name) | Android \(.version)"
          ' pcloudy-devices.json

          echo ""
          echo "Full device list saved to:"
          echo "pcloudy-devices.json"

          echo ""
          echo "=========================================="
          echo "STAGE 3 COMPLETED"
          echo "=========================================="


      # ============================================================
      # STAGE 4 - SELECT ONE DEVICE
      # ============================================================

      - name: STAGE 4 - Select One Available Device
        id: selected-device
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 4 - SELECT ONE DEVICE"
          echo "=========================================="

          if [ ! -s pcloudy-devices.json ]; then
            echo "ERROR: pcloudy-devices.json not found"
            exit 1
          fi

          DEVICE="$(
            jq -r '
              .result.models[]?
              | select(.available == true)
              | select((.platform // "" | ascii_downcase) == "android")
              | .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"

          if [ -z "$DEVICE" ]; then
            echo "ERROR: No available Android device found"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SELECTED DEVICE"
          echo "=========================================="

          echo "$DEVICE"

          echo ""
          echo "This exact DeviceFullName will be used by Appium."

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================="
          echo "STAGE 4 COMPLETED"
          echo "=========================================="


      # ============================================================
      # STAGE 5 - UPLOAD APK TO pCLOUDY
      # ============================================================

      - name: STAGE 5 - Upload APK to pCloudy
        id: pcloudy-upload
        shell: bash

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 5 - UPLOAD APK TO pCLOUDY"
          echo "=========================================="

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: firebase-app.apk not found"
            exit 1
          fi

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output pcloudy-upload.json \
              --write-out "%{http_code}" \
              --request POST \
              -F "file=@firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${PCLOUDY_TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "APK uploaded to pCloudy successfully"

          echo ""
          echo "Upload response:"
          cat pcloudy-upload.json

          echo ""
          echo "=========================================="
          echo "STAGE 5 COMPLETED"
          echo "=========================================="


      # ============================================================
      # STAGE 6 - SETUP PYTHON + APPIUM
      # ============================================================

      - name: STAGE 6 - Setup Python and Appium
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      - name: STAGE 6 - Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 6 - INSTALL APPIUM DEPENDENCIES"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          pip install -r requirements.txt

          echo ""
          echo "Installed packages:"
          pip list

          echo ""
          echo "=========================================="
          echo "STAGE 6 COMPLETED"
          echo "=========================================="


      # ============================================================
      # STAGE 7 - RUN APPIUM TEST
      # ============================================================

      - name: STAGE 7 - Run Appium lifecycle test
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          # Device comes from pCloudy JSON
          PCLOUDY_DEVICE: ${{ steps.selected-device.outputs.device }}

          APP_PACKAGE: com.epam.mobitru

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 7 - RUN APPIUM TEST"
          echo "=========================================="

          echo ""
          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"
          echo ""

          if [ -z "$PCLOUDY_DEVICE" ]; then
            echo "ERROR: Selected device is empty"
            exit 1
          fi

          if [ ! -f automation/test_app_lifecycle.py ]; then
            echo "ERROR: Appium test script not found"
            exit 1
          fi

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml

          echo ""
          echo "=========================================="
          echo "APPIUM TEST COMPLETED SUCCESSFULLY"
          echo "=========================================="


      # ============================================================
      # STAGE 8 - UPLOAD RESULTS
      # ============================================================

      - name: STAGE 8 - Upload test results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: appium-test-results

          path: |
            appium-results.xml
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json

          if-no-files-found: warn
