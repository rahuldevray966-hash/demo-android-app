name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  appium-pcloudy:

    name: Firebase → pCloudy → Device List → Appium

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # STAGE 1 - Checkout
      # ==================================================

      - name: STAGE 1 - Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # STAGE 2 - Firebase Authentication
      # ==================================================

      - name: STAGE 2 - Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ==================================================
      # STAGE 3 - Firebase Access Token
      # ==================================================

      - name: STAGE 3 - Get Firebase access token
        id: firebase-token
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 3 - Firebase Access Token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ==================================================
      # STAGE 4 - Get Latest Firebase Release
      # ==================================================

      - name: STAGE 4 - Get latest Firebase release
        id: firebase-release
        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 4 - Getting latest Firebase release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID does not look like an Android Firebase App ID"
            exit 1
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          echo "Calling Firebase App Distribution API..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Firebase returned invalid JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase release found"
            cat firebase-release.json
            exit 1
          fi

          echo "Firebase release found:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ==================================================
      # STAGE 5 - Download Existing APK
      # ==================================================

      - name: STAGE 5 - Download APK from Firebase
        shell: bash

        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 5 - Downloading existing APK"
          echo "=========================================="

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase download URL is empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          echo "Firebase APK downloaded successfully"

          ls -lh firebase-app.apk


      # ==================================================
      # STAGE 6 - Verify APK
      # ==================================================

      - name: STAGE 6 - Verify APK
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 6 - Verifying APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful"


      # ==================================================
      # STAGE 7 - pCloudy Authentication
      # ==================================================

      - name: STAGE 7 - Authenticate with pCloudy
        id: pcloudy-auth
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 7 - pCloudy Authentication"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # ==================================================
      # STAGE 8 - Get pCloudy Device List
      # ==================================================

      - name: STAGE 8 - Get pCloudy device list
        id: device-list
        shell: bash

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 8 - Getting pCloudy device list"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${PCLOUDY_TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "RAW pCloudy Device Response"
          echo "=========================================="

          cat pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Available Android Devices"
          echo "=========================================="

          jq -r '
            .result.models[]?
            | select(.available == true)
            | select((.platform // "" | ascii_downcase) == "android")
            | "\(.full_name) | \(.display_name) | Android \(.version)"
          ' pcloudy-devices.json || true


      # ==================================================
      # STAGE 9 - Select ONE Available Device
      # ==================================================

      - name: STAGE 9 - Select one available Android device
        id: selected-device
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 9 - Selecting available device"
          echo "=========================================="

          if [ ! -s pcloudy-devices.json ]; then
            echo "ERROR: pcloudy-devices.json is missing or empty"
            exit 1
          fi

          echo "Trying to select Galaxy S25 first..."

          DEVICE="$(
            jq -r '
              .result.models[]?
              | select(.available == true)
              | select((.platform // "" | ascii_downcase) == "android")
              | select(
                  ((.display_name // "") | ascii_downcase | contains("galaxy s25"))
                  or
                  ((.model // "") | ascii_downcase | contains("galaxys25"))
                )
              | .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"

          if [ -z "$DEVICE" ]; then

            echo "Galaxy S25 is not currently available."

            echo "Selecting first available Android device..."

            DEVICE="$(
              jq -r '
                .result.models[]?
                | select(.available == true)
                | select((.platform // "" | ascii_downcase) == "android")
                | .full_name
              ' pcloudy-devices.json |
              head -n 1
            "

          fi

          if [ -z "$DEVICE" ]; then
            echo "ERROR: No available Android device found"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SELECTED DEVICE"
          echo "=========================================="

          echo "$DEVICE"

          echo ""
          echo "This exact DeviceFullName will be sent to Appium."

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"


      # ==================================================
      # STAGE 10 - Upload APK to pCloudy
      # ==================================================

      - name: STAGE 10 - Upload APK to pCloudy
        id: pcloudy-upload
        shell: bash

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 10 - Uploading APK to pCloudy"
          echo "=========================================="

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${PCLOUDY_TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo ""
          echo "pCloudy APK upload successful"

          echo ""
          echo "Upload response:"
          cat pcloudy-upload.json


      # ==================================================
      # STAGE 11 - Setup Python
      # ==================================================

      - name: STAGE 11 - Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ==================================================
      # STAGE 12 - Install Appium Dependencies
      # ==================================================

      - name: STAGE 12 - Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 12 - Installing Appium dependencies"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            echo ""
            echo "Please add requirements.txt to repository root."
            exit 1
          fi

          pip install -r requirements.txt

          echo ""
          echo "Installed packages:"
          pip list


      # ==================================================
      # STAGE 13 - Run Appium Test
      # ==================================================

      - name: STAGE 13 - Run Appium lifecycle test
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          # Device comes automatically from JSON
          PCLOUDY_DEVICE: ${{ steps.selected-device.outputs.device }}

          APP_PACKAGE: com.epam.mobitru

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 13 - Starting Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"

          echo "=========================================="

          if [ -z "$PCLOUDY_DEVICE" ]; then
            echo "ERROR: Selected pCloudy device is empty"
            exit 1
          fi

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml

          echo ""
          echo "=========================================="
          echo "Appium lifecycle test completed successfully"
          echo "=========================================="


      # ==================================================
      # STAGE 14 - Upload Results
      # ==================================================

      - name: STAGE 14 - Upload test results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: appium-test-results

          path: |
            appium-results.xml
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json
            firebase-app.apk

          if-no-files-found: warn
