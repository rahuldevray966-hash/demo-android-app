name: Android Firebase → pCloudy Automation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PACKAGE: com.epam.mobitru
  PCLOUDY_DURATION: 30
  PCLOUDY_APPIUM_URL: https://device.pcloudy.com/appiumcloud/wd/hub
  PCLOUDY_ENABLE_PERFORMANCE_DATA: "true"
  PYTHONUNBUFFERED: "1"

jobs:

  # ============================================================
  # JOB 1: GET LATEST APK FROM FIREBASE APP DISTRIBUTION
  # ============================================================
  firebase:
    name: Firebase - Get Latest APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Get Google access token
        id: gcloud-token
        run: |
          TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not obtain Google access token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Find latest Firebase release
        id: latest-release
        env:
          ACCESS_TOKEN: ${{ steps.gcloud-token.outputs.token }}
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          set -euo pipefail

          echo "Getting Firebase App Distribution releases..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request GET \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=20"
          )"

          echo "$RESPONSE" > firebase-releases.json

          echo "Firebase release response:"
          jq '.' firebase-releases.json

          RELEASE_NAME="$(
            jq -r '
              [
                .releases[]?
                | select(.releaseNotes? != null or .buildVersion? != null)
              ]
              | .[0].name // empty
            ' firebase-releases.json
          )"

          if [ -z "$RELEASE_NAME" ]; then
            echo "ERROR: Could not find Firebase release"
            exit 1
          fi

          echo "Latest release:"
          echo "$RELEASE_NAME"

          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Get Firebase APK download URL
        id: download-url
        env:
          ACCESS_TOKEN: ${{ steps.gcloud-token.outputs.token }}
          RELEASE_NAME: ${{ steps.latest-release.outputs.release_name }}
        run: |
          set -euo pipefail

          RELEASE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request GET \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              "https://firebaseappdistribution.googleapis.com/v1/${RELEASE_NAME}"
          )"

          echo "$RELEASE" > firebase-release.json

          echo "Release details:"
          jq '.' firebase-release.json

          DOWNLOAD_URL="$(
            jq -r '
              .binaryDownloadUri //
              .binaryDownloadUrl //
              .downloadUri //
              empty
            ' firebase-release.json
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase release does not expose a binary download URL"
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Download Firebase APK
        env:
          DOWNLOAD_URL: ${{ steps.download-url.outputs.download_url }}
        run: |
          set -euo pipefail

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            --output firebase-app.apk \
            "$DOWNLOAD_URL"

          test -s firebase-app.apk

          echo "APK downloaded successfully"
          ls -lh firebase-app.apk

          file firebase-app.apk

      - name: Upload Firebase APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-apk
          path: firebase-app.apk
          retention-days: 1


  # ============================================================
  # JOB 2: PCLOUDY AUTH + DEVICE LIST + APK UPLOAD
  # ============================================================
  pcloudy-upload:
    name: pCloudy - Upload APK
    runs-on: ubuntu-latest
    needs: firebase

    outputs:
      pcloudy_token: ${{ steps.device-auth.outputs.token }}
      pcloudy_app_name: ${{ steps.upload-apk.outputs.app_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Firebase APK
        uses: actions/download-artifact@v4
        with:
          name: firebase-apk
          path: .

      - name: Verify APK
        run: |
          set -euo pipefail

          test -f firebase-app.apk
          test -s firebase-app.apk

          ls -lh firebase-app.apk
          file firebase-app.apk

      # --------------------------------------------------------
      # pCloudy authentication
      # --------------------------------------------------------
      - name: Authenticate pCloudy
        id: device-auth
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          echo "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            jq -r '.result.token // empty' pcloudy-auth.json
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not obtain pCloudy token"
            jq '.' pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "Fresh pCloudy token received successfully"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Get available devices
      # --------------------------------------------------------
      - name: Get pCloudy Android devices
        env:
          PCLOUDY_TOKEN: ${{ steps.device-auth.outputs.token }}
        run: |
          set -euo pipefail

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{
              \"token\":\"${PCLOUDY_TOKEN}\",
              \"duration\":30,
              \"platform\":\"Android\",
              \"available_now\":true
            }" \
            "https://device.pcloudy.com/api/devices" \
            > pcloudy-devices.json

          echo "pCloudy devices received"

          jq '.' pcloudy-devices.json | head -200

      # --------------------------------------------------------
      # Validate config/devices.json
      # --------------------------------------------------------
      - name: Validate configured devices
        run: |
          set -euo pipefail

          CONFIG="config/devices.json"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found"
            exit 1
          fi

          echo "Configured devices:"
          jq '.' "$CONFIG"

          COUNT="$(
            jq '[.devices[]? | select(.enabled == true)] | length' "$CONFIG"
          )"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No enabled devices configured"
            exit 1
          fi

          echo "Enabled devices: $COUNT"

          jq -r '
            .devices[]?
            | select(.enabled == true)
            | .name
          ' "$CONFIG"

      # --------------------------------------------------------
      # Upload APK to pCloudy
      # --------------------------------------------------------
      - name: Upload APK to pCloudy
        id: upload-apk
        env:
          PCLOUDY_TOKEN: ${{ steps.device-auth.outputs.token }}
        run: |
          set -euo pipefail

          echo "Uploading firebase-app.apk to pCloudy..."

          HTTP_CODE="$(
            curl \
              --http1.1 \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              --output pcloudy-upload.json \
              --write-out "%{http_code}" \
              --request POST \
              --form "file=@firebase-app.apk" \
              --form "source_type=raw" \
              --form "token=${PCLOUDY_TOKEN}" \
              --form "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "HTTP status: $HTTP_CODE"

          cat pcloudy-upload.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: pCloudy APK upload failed"
            exit 1
          fi

          UPLOAD_RESULT="$(
            jq -r '
              .result.file_name //
              .result.application_name //
              .result.name //
              .result.app_name //
              .result.fileName //
              empty
            ' pcloudy-upload.json
          )"

          if [ -z "$UPLOAD_RESULT" ]; then
            echo "WARNING: Could not extract application name automatically."
            echo "Using firebase-app.apk"
            UPLOAD_RESULT="firebase-app.apk"
          fi

          echo "pCloudy application name: $UPLOAD_RESULT"

          echo "app_name=$UPLOAD_RESULT" >> "$GITHUB_OUTPUT"


  # ============================================================
  # JOB 3: DEVICE TEST + PERFORMANCE + RELEASE
  # ============================================================
  device-tests:
    name: pCloudy - Appium Automation
    runs-on: ubuntu-latest
    needs: pcloudy-upload

    env:
      PCLOUDY_APP_NAME: ${{ needs.pcloudy-upload.outputs.pcloudy_app_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Firebase APK
        uses: actions/download-artifact@v4
        with:
          name: firebase-apk
          path: .

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            pytest \
            Appium-Python-Client \
            selenium \
            requests

      - name: Show versions
        run: |
          python --version
          pip --version
          pytest --version

      # --------------------------------------------------------
      # Fresh pCloudy authentication
      # --------------------------------------------------------
      - name: Fresh pCloudy authentication
        id: fresh-auth
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          echo "$RESPONSE" > pcloudy-stage3-auth.json

          TOKEN="$(
            jq -r '.result.token // empty' pcloudy-stage3-auth.json
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Stage 3 pCloudy authentication failed"
            jq '.' pcloudy-stage3-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "Fresh pCloudy token received successfully"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Get fresh device list
      # --------------------------------------------------------
      - name: Get fresh pCloudy device list
        env:
          PCLOUDY_TOKEN: ${{ steps.fresh-auth.outputs.token }}
        run: |
          set -euo pipefail

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{
              \"token\":\"${PCLOUDY_TOKEN}\",
              \"duration\":30,
              \"platform\":\"Android\",
              \"available_now\":true
            }" \
            "https://device.pcloudy.com/api/devices" \
            > pcloudy-stage3-devices.json

          test -s pcloudy-stage3-devices.json

      # --------------------------------------------------------
      # Prepare device matrix from config/devices.json
      # --------------------------------------------------------
      - name: Validate configured devices against pCloudy
        id: device-config
        env:
          PCLOUDY_TOKEN: ${{ steps.fresh-auth.outputs.token }}
        run: |
          set -euo pipefail

          CONFIG="config/devices.json"

          jq -r '
            .devices[]?
            | select(.enabled == true)
            | .name
          ' "$CONFIG" > enabled-devices.txt

          echo "Configured enabled devices:"
          cat enabled-devices.txt

          while IFS= read -r DEVICE_NAME; do

            [ -z "$DEVICE_NAME" ] && continue

            echo ""
            echo "Checking device:"
            echo "$DEVICE_NAME"

            DEVICE_ID="$(
              jq -r \
                --arg name "$DEVICE_NAME" '
                  ..
                  | objects
                  | select(.full_name? == $name)
                  | .id?
                ' \
                pcloudy-stage3-devices.json \
              | head -n 1
            )"

            if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
              echo "ERROR: Device not available:"
              echo "$DEVICE_NAME"
              exit 1
            fi

            echo "Device ID: $DEVICE_ID"

          done < enabled-devices.txt

          echo "All configured devices are available."

      # --------------------------------------------------------
      # Install/verify Appium client
      # --------------------------------------------------------
      - name: Verify Appium client
        run: |
          python - <<'PY'
          import appium
          import selenium

          print("Appium:", getattr(appium, "__version__", "unknown"))
          print("Selenium:", selenium.__version__)
          PY

      # --------------------------------------------------------
      # Sequential device automation
      # --------------------------------------------------------
      - name: Run pCloudy devices sequentially
        env:
          PCLOUDY_TOKEN: ${{ steps.fresh-auth.outputs.token }}
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          PCLOUDY_APPIUM_URL: ${{ env.PCLOUDY_APPIUM_URL }}
          PCLOUDY_DURATION: ${{ env.PCLOUDY_DURATION }}
          PCLOUDY_ENABLE_PERFORMANCE_DATA: ${{ env.PCLOUDY_ENABLE_PERFORMANCE_DATA }}
        run: |
          set -euo pipefail

          mkdir -p performance-results
          mkdir -p pcloudy-logs

          TEST_FAILED=0

          while IFS= read -r DEVICE_NAME; do

            [ -z "$DEVICE_NAME" ] && continue

            echo ""
            echo "======================================================"
            echo "Testing device: $DEVICE_NAME"
            echo "======================================================"

            # --------------------------------------------------
            # Find device ID
            # --------------------------------------------------
            DEVICE_ID="$(
              jq -r \
                --arg name "$DEVICE_NAME" '
                  ..
                  | objects
                  | select(.full_name? == $name)
                  | .id?
                ' \
                pcloudy-stage3-devices.json \
              | head -n 1
            )"

            if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
              echo "ERROR: Device ID not found for:"
              echo "$DEVICE_NAME"
              TEST_FAILED=1
              continue
            fi

            echo "Device ID: $DEVICE_ID"

            RESERVATION_ID=""

            # --------------------------------------------------
            # BOOK DEVICE
            # --------------------------------------------------
            echo ""
            echo "[1/6] Booking device"

            BOOK_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg id "$DEVICE_ID" \
                --argjson duration "$PCLOUDY_DURATION" \
                '{
                  token: $token,
                  id: $id,
                  duration: $duration
                }'
            )"

            echo "Booking request:"
            echo "$BOOK_PAYLOAD" | jq 'del(.token)'

            BOOK_HTTP="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$BOOK_PAYLOAD" \
                "https://device.pcloudy.com/api/book_device"
            )"

            echo "$BOOK_HTTP" | jq '.' || echo "$BOOK_HTTP"

            echo "$BOOK_HTTP" > "pcloudy-logs/${DEVICE_ID}-book.json"

            # Try several known/possible reservation fields.
            RESERVATION_ID="$(
              echo "$BOOK_HTTP" | jq -r '
                .result.reservation_id //
                .result.reservationId //
                .result.rid //
                .result.id //
                .reservation_id //
                .reservationId //
                .rid //
                empty
              '
            )"

            if [ -z "$RESERVATION_ID" ] || [ "$RESERVATION_ID" = "null" ]; then
              echo "ERROR: Could not extract reservation ID"
              echo "Full booking response:"
              cat "pcloudy-logs/${DEVICE_ID}-book.json"
              TEST_FAILED=1
              continue
            fi

            echo "Reservation ID: $RESERVATION_ID"

            # --------------------------------------------------
            # START PERFORMANCE DATA
            # --------------------------------------------------
            echo ""
            echo "[2/6] Starting performance data"

            PERFORMANCE_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RESERVATION_ID" \
                --arg pkg "$APP_PACKAGE" \
                '{
                  token: $token,
                  rid: $rid,
                  pkg: $pkg
                }'
            )"

            echo "$PERFORMANCE_PAYLOAD" | jq 'del(.token)'

            PERFORMANCE_START="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$PERFORMANCE_PAYLOAD" \
                "https://device.pcloudy.com/api/start_performance_data"
            )"

            echo "$PERFORMANCE_START" | jq '.' || echo "$PERFORMANCE_START"

            echo "$PERFORMANCE_START" \
              > "pcloudy-logs/${DEVICE_ID}-performance-start.json"

            # --------------------------------------------------
            # APPIUM AUTOMATION
            # --------------------------------------------------
            echo ""
            echo "[3/6] Running Appium automation"

            export PCLOUDY_DEVICE="$DEVICE_NAME"
            export PCLOUDY_APP_NAME="$PCLOUDY_APP_NAME"

            if pytest \
              -q \
              automation/test_app_lifecycle.py \
              --junitxml="performance-results/${DEVICE_ID}-junit.xml"; then

              echo "Appium test PASSED"

            else

              echo "Appium test FAILED"
              TEST_FAILED=1

            fi

            # --------------------------------------------------
            # PERFORMANCE FILE LIST
            # --------------------------------------------------
            echo ""
            echo "[4/6] Getting performance files"

            FILE_LIST_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RESERVATION_ID" \
                '{
                  token: $token,
                  rid: $rid
                }'
            )"

            FILE_LIST="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$FILE_LIST_PAYLOAD" \
                "https://device.pcloudy.com/api/manual_access_files_list" \
              || true
            )"

            echo "$FILE_LIST" | jq '.' || echo "$FILE_LIST"

            echo "$FILE_LIST" \
              > "pcloudy-logs/${DEVICE_ID}-performance-files.json"

            # --------------------------------------------------
            # DOWNLOAD PERFORMANCE DATA
            # --------------------------------------------------
            echo ""
            echo "[5/6] Downloading performance data"

            DOWNLOAD_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RESERVATION_ID" \
                '{
                  token: $token,
                  rid: $rid
                }'
            )"

            DOWNLOAD_RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$DOWNLOAD_PAYLOAD" \
                "https://device.pcloudy.com/api/download_manual_access_data" \
              || true
            )"

            echo "$DOWNLOAD_RESPONSE" | jq '.' \
              || echo "$DOWNLOAD_RESPONSE"

            echo "$DOWNLOAD_RESPONSE" \
              > "pcloudy-logs/${DEVICE_ID}-performance-download.json"

            # If API returns a URL, try downloading it.
            DOWNLOAD_URL="$(
              echo "$DOWNLOAD_RESPONSE" | jq -r '
                .result.url //
                .result.download_url //
                .result.downloadUrl //
                .url //
                empty
              ' 2>/dev/null || true
            )"

            if [ -n "$DOWNLOAD_URL" ]; then

              echo "Downloading performance archive..."

              curl \
                --silent \
                --show-error \
                --location \
                --retry 5 \
                --retry-delay 3 \
                --retry-all-errors \
                --output \
                "performance-results/${DEVICE_ID}-performance-data" \
                "$DOWNLOAD_URL" || true

            else

              echo "No direct download URL returned."

            fi

            # --------------------------------------------------
            # RELEASE DEVICE
            # --------------------------------------------------
            echo ""
            echo "[6/6] Releasing device"

            RELEASE_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RESERVATION_ID" \
                --arg id "$DEVICE_ID" \
                '{
                  token: $token,
                  rid: $rid,
                  id: $id
                }'
            )"

            RELEASE_RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$RELEASE_PAYLOAD" \
                "https://device.pcloudy.com/api/release_device" \
              || true
            )"

            echo "$RELEASE_RESPONSE" | jq '.' \
              || echo "$RELEASE_RESPONSE"

            echo "$RELEASE_RESPONSE" \
              > "pcloudy-logs/${DEVICE_ID}-release.json"

            echo ""
            echo "Finished device:"
            echo "$DEVICE_NAME"

          done < enabled-devices.txt

          echo ""
          echo "======================================================"
          echo "All configured devices processed"
          echo "======================================================"

          if [ "$TEST_FAILED" -ne 0 ]; then
            exit 1
          fi

      # --------------------------------------------------------
      # Upload logs even if test fails
      # --------------------------------------------------------
      - name: Upload pCloudy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcloudy-logs
          path: pcloudy-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcloudy-performance-results
          path: performance-results/
          if-no-files-found: warn
          retention-days: 7
