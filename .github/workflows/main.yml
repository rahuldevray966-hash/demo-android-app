name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  appium-pcloudy:
    name: Firebase APK → pCloudy → Appium Pixel 7
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ==================================================
      # 2. Authenticate with Firebase
      # ==================================================

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ==================================================
      # 3. Get Firebase access token
      # ==================================================

      - name: Get Firebase access token
        id: firebase-token
        run: |
          set -e

          echo "Getting Firebase access token..."

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Could not get Firebase access token"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ==================================================
      # 4. Get latest APK from Firebase
      # ==================================================

      - name: Get latest Firebase release
        id: firebase-release
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -e

          echo "Getting latest Firebase release..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=1&orderBy=createTime%20desc")

          echo "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Firebase APK download URL not found"
            cat firebase-release.json
            exit 1
          fi

          echo "Firebase release found"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ==================================================
      # 5. Download existing APK from Firebase
      # ==================================================

      - name: Download APK from Firebase
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -e

          echo "Downloading existing APK from Firebase..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o firebase-app.apk \
            "$DOWNLOAD_URL"

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: Firebase APK download failed"
            exit 1
          fi

          echo "Firebase APK downloaded successfully"

          ls -lh firebase-app.apk


      # ==================================================
      # 6. Verify APK
      # ==================================================

      - name: Verify APK
        run: |
          set -e

          echo "Verifying APK..."

          file firebase-app.apk

          APK_SIZE=$(stat -c%s firebase-app.apk)

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful"


      # ==================================================
      # 7. Authenticate with pCloudy
      # ==================================================

      - name: Authenticate with pCloudy
        id: pcloudy-auth
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -e

          echo "Authenticating with pCloudy..."

          RESPONSE=$(curl -sS \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          echo "$RESPONSE" > pcloudy-auth.json

          TOKEN=$(echo "$RESPONSE" | jq -r '.result.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # ==================================================
      # 8. Upload existing Firebase APK to pCloudy
      # ==================================================

      - name: Upload APK to pCloudy
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -e

          echo "Uploading Firebase APK to pCloudy..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-upload.json \
            -w "%{http_code}" \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${PCLOUDY_TOKEN}" \
            -F "filter=all" \
            "https://device.pcloudy.com/api/upload_file")

          echo "pCloudy upload HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "APK uploaded to pCloudy successfully"


      # ==================================================
      # 9. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 10. Install Appium Python dependencies
      # ==================================================

      - name: Install Appium dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          echo "Appium dependencies installed successfully"


      # ==================================================
      # 11. Run Appium test on Pixel 7
      # ==================================================

      - name: Run Appium lifecycle test on Pixel 7
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          PCLOUDY_DEVICE: Google_Pixel7_Android_17.0.0_81870

          APP_PACKAGE: com.epam.mobitru

        run: |
          set -e

          echo "=========================================="
          echo "Starting Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"

          echo "=========================================="

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml

          echo "=========================================="
          echo "Appium test completed successfully"
          echo "=========================================="


      # ==================================================
      # 12. Upload test results
      # ==================================================

      - name: Upload Appium test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results-pixel7
          path: |
            appium-results.xml
            firebase-release.json
            pcloudy-auth.json
            pcloudy-upload.json
          if-no-files-found: warn
