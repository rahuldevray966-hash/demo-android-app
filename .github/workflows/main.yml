name: Build → Firebase → pCloudy Pixel

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcloudy-install:
    name: Build APK and Install on pCloudy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'


      # ============================================================
      # 3. Make Gradle executable
      # ============================================================
      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ============================================================
      # 4. Build APK
      # ============================================================
      - name: Build APK
        run: ./gradlew assembleDebug


      # ============================================================
      # 5. Verify APK
      # ============================================================
      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          ls -lh "$APK_PATH"


      # ============================================================
      # 6. Firebase Authentication
      # ============================================================
      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ============================================================
      # 7. Install Firebase CLI
      # ============================================================
      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      # ============================================================
      # 8. Upload APK to Firebase App Distribution
      # ============================================================
      - name: Upload APK to Firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_EMAIL: ${{ secrets.FIREBASE_TESTER_EMAIL }}

        run: |
          echo "Uploading APK to Firebase..."

          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "GitHub Actions build - $GITHUB_SHA" \
            --testers "$FIREBASE_TESTER_EMAIL"

          echo "Firebase upload successful"


      # ============================================================
      # 9. Get Firebase Access Token
      # ============================================================
      - name: Get Firebase access token
        id: firebase-token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token not generated"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10. Get Latest Firebase Release
      # ============================================================
      - name: Get latest Firebase release
        id: firebase-release
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          echo "Getting latest Firebase release..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=1&orderBy=createTime%20desc")

          echo "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Firebase APK download URL not found"
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          echo "Firebase release found"


      # ============================================================
      # 11. Download APK from Firebase
      # ============================================================
      - name: Download APK from Firebase
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          echo "Downloading APK from Firebase..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o firebase-app.apk \
            "$DOWNLOAD_URL"

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: Firebase APK download failed"
            exit 1
          fi

          echo "Firebase APK downloaded:"
          ls -lh firebase-app.apk


      # ============================================================
      # 12. Verify APK
      # ============================================================
      - name: Verify Firebase APK
        run: |
          file firebase-app.apk

          APK_SIZE=$(stat -c%s firebase-app.apk)

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"


      # ============================================================
      # 13. pCloudy Authentication
      # ============================================================
      - name: Authenticate with pCloudy
        id: pcloudy-auth

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          echo "Authenticating with pCloudy..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          # IMPORTANT:
          # pCloudy response is an OBJECT.
          # Token is inside result.token.

          TOKEN=$(echo "$RESPONSE" | jq -r '.result.token // empty')

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy token not found"

            echo "Response structure:"
            echo "$RESPONSE" | jq 'del(.result.token)'

            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # ============================================================
      # 14. Upload APK to pCloudy
      # ============================================================
      - name: Upload APK to pCloudy
        id: pcloudy-upload

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          echo "Uploading Firebase APK to pCloudy..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${PCLOUDY_TOKEN}" \
            -F "filter=apk" \
            "https://device.pcloudy.com/api/upload_file")

          echo "$RESPONSE" > pcloudy-upload.json

          echo "pCloudy upload completed"

          # We deliberately use the filename we uploaded.
          # This avoids depending on the upload response structure.

          echo "filename=firebase-app.apk" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 15. Verify APK exists in pCloudy Cloud Drive
      # ============================================================
      - name: Verify APK in pCloudy
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          echo "Checking pCloudy cloud drive..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"limit\": \"100\",
              \"filter\": \"apk\"
            }" \
            "https://device.pcloudy.com/api/drive")

          echo "$RESPONSE" > pcloudy-drive.json

          FOUND=$(echo "$RESPONSE" | jq -r '
            tostring | contains("firebase-app.apk")
          ')

          if [ "$FOUND" != "true" ]; then
            echo "ERROR: firebase-app.apk not found in pCloudy cloud drive"
            exit 1
          fi

          echo "firebase-app.apk exists in pCloudy"


      # ============================================================
      # 16. Get Available Android Devices
      # ============================================================
      - name: Get available pCloudy Android devices
        id: pcloudy-devices

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          echo "Getting available Android devices..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"duration\": \"15\",
              \"platform\": \"android\",
              \"available_now\": \"true\"
            }" \
            "https://device.pcloudy.com/api/devices")

          echo "$RESPONSE" > pcloudy-devices.json

          echo "pCloudy device list received"

          # Print only device names/models.
          # Do not print token or credentials.

          echo "$RESPONSE" | jq -r '
            .. |
            objects |
            [
              (.id? // ""),
              (.full_name? // .fullName? // .deviceFullName? // ""),
              (.model? // .device_name? // .deviceName? // ""),
              (.version? // .osVersion? // "")
            ] |
            select(.[0] != "")
            | @tsv
          ' 2>/dev/null || true


      # ============================================================
      # 17. Select Pixel 8 first, then Pixel 7
      # ============================================================
      - name: Select Pixel 7 or Pixel 8
        id: select-device

        run: |
          echo "Searching for available Pixel 8 / Pixel 7..."

          DEVICE_JSON=$(jq -c '
            .. |
            objects |
            select(
              has("id") and
              (
                ((.full_name? // "") | ascii_downcase | contains("pixel 8")) or
                ((.fullName? // "") | ascii_downcase | contains("pixel 8")) or
                ((.deviceFullName? // "") | ascii_downcase | contains("pixel 8")) or
                ((.model? // "") | ascii_downcase | contains("pixel 8")) or
                ((.device_name? // "") | ascii_downcase | contains("pixel 8")) or
                ((.deviceName? // "") | ascii_downcase | contains("pixel 8")) or

                ((.full_name? // "") | ascii_downcase | contains("pixel 7")) or
                ((.fullName? // "") | ascii_downcase | contains("pixel 7")) or
                ((.deviceFullName? // "") | ascii_downcase | contains("pixel 7")) or
                ((.model? // "") | ascii_downcase | contains("pixel 7")) or
                ((.device_name? // "") | ascii_downcase | contains("pixel 7")) or
                ((.deviceName? // "") | ascii_downcase | contains("pixel 7"))
              )
            ) |
            {
              id: .id,
              name:
                (
                  .full_name? //
                  .fullName? //
                  .deviceFullName? //
                  .model? //
                  .device_name? //
                  .deviceName? //
                  "Unknown"
                )
            }
          ' pcloudy-devices.json | head -n 20)

          echo "Matching devices:"
          echo "$DEVICE_JSON"

          # Prefer Pixel 8.
          PIXEL8=$(echo "$DEVICE_JSON" | jq -r '
            select(.name | ascii_downcase | contains("pixel 8"))
            | .id
          ' | head -n 1)

          # Otherwise Pixel 7.
          PIXEL7=$(echo "$DEVICE_JSON" | jq -r '
            select(.name | ascii_downcase | contains("pixel 7"))
            | .id
          ' | head -n 1)

          if [ -n "$PIXEL8" ]; then
            DEVICE_ID="$PIXEL8"
            echo "Selected Pixel 8"
          elif [ -n "$PIXEL7" ]; then
            DEVICE_ID="$PIXEL7"
            echo "Selected Pixel 7"
          else
            echo "ERROR: No available Pixel 7 or Pixel 8 found"
            exit 1
          fi

          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 18. Book Device
      # ============================================================
      - name: Book pCloudy device
        id: book-device

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          DEVICE_ID: ${{ steps.select-device.outputs.device_id }}

        run: |
          echo "Booking pCloudy device..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"duration\": \"15\",
              \"id\": \"${DEVICE_ID}\"
            }" \
            "https://device.pcloudy.com/api/book_device")

          echo "$RESPONSE" > pcloudy-book.json

          echo "Device booking successful"

          # pCloudy booking response can contain rid at
          # different nesting levels depending on API response.
          RID=$(echo "$RESPONSE" | jq -r '
            .. |
            objects |
            .rid? //
            empty
          ' | head -n 1)

          if [ -z "$RID" ]; then
            echo "ERROR: Reservation ID (rid) not found"
            exit 1
          fi

          echo "Reservation created"

          echo "rid=$RID" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 19. Install and Launch APK
      # ============================================================
      - name: Install APK on booked pCloudy device
        id: install-app

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          RID: ${{ steps.book-device.outputs.rid }}
          APK_NAME: firebase-app.apk

        run: |
          echo "Installing APK on booked pCloudy device..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"rid\": \"${RID}\",
              \"filename\": \"${APK_NAME}\",
              \"grant_all_permissions\": \"true\"
            }" \
            "https://device.pcloudy.com/api/install_app")

          echo "$RESPONSE" > pcloudy-install.json

          echo "pCloudy install/launch API completed"

          echo "Install response:"
          echo "$RESPONSE" | jq .


      # ============================================================
      # 20. Release Device
      # ============================================================
      - name: Release pCloudy device
        if: always() && steps.book-device.outputs.rid != ''

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          RID: ${{ steps.book-device.outputs.rid }}

        run: |
          echo "Releasing pCloudy device..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"rid\": \"${RID}\"
            }" \
            -H "token: ${PCLOUDY_TOKEN}" \
            "https://device.pcloudy.com/api/release_device")

          echo "$RESPONSE" > pcloudy-release.json

          echo "pCloudy device released successfully"


      # ============================================================
      # 21. Upload Results / Logs
      # ============================================================
      - name: Upload pCloudy results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-results
          path: |
            firebase-release.json
            pcloudy-upload.json
            pcloudy-drive.json
            pcloudy-devices.json
            pcloudy-book.json
            pcloudy-install.json
            pcloudy-release.json
          if-no-files-found: ignore
