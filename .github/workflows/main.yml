name: Build → Firebase → pCloudy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build-firebase-pcloudy:

    name: Build APK → Firebase → pCloudy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Java
      # ============================================================

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'


      # ============================================================
      # 3. Gradle permission
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ============================================================
      # 4. Build NEW APK
      # ============================================================

      - name: Build APK
        run: |
          echo "Building new APK..."

          ./gradlew assembleDebug

          echo "APK build completed."


      # ============================================================
      # 5. Verify APK
      # ============================================================

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK_PATH"


      # ============================================================
      # 6. Firebase Authentication
      # ============================================================

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ============================================================
      # 7. Install Firebase CLI
      # ============================================================

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools

          firebase --version


      # ============================================================
      # 8. Upload NEW APK to Firebase
      # ============================================================

      - name: Upload APK to Firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_EMAIL: ${{ secrets.FIREBASE_TESTER_EMAIL }}

        run: |
          echo "Uploading NEW APK to Firebase..."

          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "GitHub Actions build - $GITHUB_SHA" \
            --testers "$FIREBASE_TESTER_EMAIL"

          echo "Firebase upload completed."


      # ============================================================
      # 9. Get Firebase Access Token
      # ============================================================

      - name: Get Firebase access token
        id: firebase-token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token not generated"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful."


      # ============================================================
      # 10. Get Latest Firebase Release
      # ============================================================

      - name: Get latest Firebase release
        id: firebase-release
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          echo "Getting latest Firebase release..."

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=1&orderBy=createTime%20desc")

          echo "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Firebase APK download URL not found"
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          echo "Latest Firebase release found."


      # ============================================================
      # 11. Download APK from Firebase
      # ============================================================

      - name: Download APK from Firebase
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          echo "Downloading APK from Firebase..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o firebase-app.apk \
            "$DOWNLOAD_URL"

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: Firebase APK download failed"
            exit 1
          fi

          echo "Firebase APK downloaded:"
          ls -lh firebase-app.apk


      # ============================================================
      # 12. Verify downloaded APK
      # ============================================================

      - name: Verify Firebase APK
        run: |
          echo "Verifying APK..."

          file firebase-app.apk

          APK_SIZE=$(stat -c%s firebase-app.apk)

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful."


      # ============================================================
      # 13. Authenticate with pCloudy
      # ============================================================

      - name: Authenticate with pCloudy
        id: pcloudy-auth

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -e

          echo "Authenticating with pCloudy..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-auth.json \
            -w "%{http_code}" \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          echo "pCloudy authentication HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: pCloudy authentication failed"
            exit 1
          fi

          # Expected response:
          #
          # {
          #   "result": {
          #     "token": "xxxxx",
          #     "code": 200
          #   }
          # }

          TOKEN=$(python3 - <<'PY'
          import json
          import sys

          with open("pcloudy-auth.json", "r") as f:
              data = json.load(f)

          token = data.get("result", {}).get("token")

          if not token:
              print("ERROR: pCloudy token not found", file=sys.stderr)
              sys.exit(1)

          print(token)
          PY
          )

          if [ -z "${TOKEN}" ]; then
            echo "ERROR: Empty pCloudy token"
            exit 1
          fi

          # Never expose token in GitHub logs.
          echo "::add-mask::${TOKEN}"

          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful."


      # ============================================================
      # 14. Get Available Android Devices
      # ============================================================

      - name: Get available Android devices
        id: pcloudy-devices

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -e

          echo "Getting available Android devices..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-devices.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"duration\": 15,
              \"platform\": \"android\",
              \"available_now\": true
            }" \
            "https://device.pcloudy.com/api/devices")

          echo "Device list HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Failed to get pCloudy devices"
            cat pcloudy-devices.json
            exit 1
          fi

          if [ ! -s pcloudy-devices.json ]; then
            echo "ERROR: Empty device response"
            exit 1
          fi

          echo "pCloudy device list received."

          echo ""
          echo "Available devices:"
          echo ""

          # Your current API response contains fields similar to:
          #
          # 803
          # Google_Pixel7_Android_17.0.0_81870
          # Pixel7
          # 17.0.0

          jq -r '
            .. |
            objects |
            select(has("id")) |
            [
              (.id // ""),
              (.full_name // .fullName // .deviceFullName // ""),
              (.model // .device_name // .deviceName // ""),
              (.version // .osVersion // .androidVersion // "")
            ] |
            @tsv
          ' pcloudy-devices.json 2>/dev/null || true


      # ============================================================
      # 15. Select Pixel 8, otherwise Pixel 7
      # ============================================================

      - name: Select Pixel 8 or Pixel 7
        id: select-device

        run: |
          set -e

          echo "Searching for available Pixel 8 / Pixel 7..."

          # --------------------------------------------------------
          # Find Pixel 8
          # --------------------------------------------------------

          PIXEL8_ID=$(jq -r '
            .. |
            objects |
            select(has("id")) |
            select(
              (
                [
                  .full_name?,
                  .fullName?,
                  .deviceFullName?,
                  .model?,
                  .device_name?,
                  .deviceName?
                ]
                | map(select(. != null))
                | join(" ")
                | ascii_downcase
              )
              | test("pixel[ _-]?8")
            ) |
            .id
          ' pcloudy-devices.json 2>/dev/null | head -n 1)


          # --------------------------------------------------------
          # Find Pixel 7
          # --------------------------------------------------------

          PIXEL7_ID=$(jq -r '
            .. |
            objects |
            select(has("id")) |
            select(
              (
                [
                  .full_name?,
                  .fullName?,
                  .deviceFullName?,
                  .model?,
                  .device_name?,
                  .deviceName?
                ]
                | map(select(. != null))
                | join(" ")
                | ascii_downcase
              )
              | test("pixel[ _-]?7")
            ) |
            .id
          ' pcloudy-devices.json 2>/dev/null | head -n 1)


          # --------------------------------------------------------
          # Prefer Pixel 8
          # --------------------------------------------------------

          if [ -n "${PIXEL8_ID}" ] && [ "${PIXEL8_ID}" != "null" ]; then

            DEVICE_ID="${PIXEL8_ID}"

            echo "Pixel 8 is available."
            echo "Selected Pixel 8."
            echo "Device ID: ${DEVICE_ID}"

          elif [ -n "${PIXEL7_ID}" ] && [ "${PIXEL7_ID}" != "null" ]; then

            DEVICE_ID="${PIXEL7_ID}"

            echo "Pixel 8 is not available."
            echo "Pixel 7 is available."
            echo "Selected Pixel 7."
            echo "Device ID: ${DEVICE_ID}"

          else

            echo "ERROR: No Pixel 7 or Pixel 8 available."

            echo ""
            echo "Available Pixel devices:"
            jq -r '
              .. |
              objects |
              select(has("id")) |
              select(
                tostring
                | ascii_downcase
                | contains("pixel")
              ) |
              tostring
            ' pcloudy-devices.json 2>/dev/null || true

            exit 1

          fi

          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 16. Book Selected Device
      # ============================================================

      - name: Book pCloudy device
        id: book-device

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          DEVICE_ID: ${{ steps.select-device.outputs.device_id }}

        run: |
          set -e

          echo "Booking pCloudy device..."
          echo "Device ID: ${DEVICE_ID}"

          HTTP_CODE=$(curl -sS \
            -o pcloudy-book.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"duration\": 15,
              \"id\": ${DEVICE_ID}
            }" \
            "https://device.pcloudy.com/api/book_device")

          echo "Book Device HTTP status: ${HTTP_CODE}"

          echo "Book Device response:"
          cat pcloudy-book.json

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Device booking failed"
            exit 1
          fi

          # Search recursively for rid.
          RID=$(jq -r '
            .. |
            objects |
            .rid? //
            empty
          ' pcloudy-book.json 2>/dev/null | head -n 1)

          if [ -z "${RID}" ] || [ "${RID}" = "null" ]; then
            echo "ERROR: Reservation ID (rid) not found"
            exit 1
          fi

          echo "Reservation created successfully."

          echo "rid=${RID}" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 17. Upload APK to pCloudy
      # ============================================================

      - name: Upload APK to pCloudy
        id: pcloudy-upload

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -e

          echo "Uploading Firebase APK to pCloudy..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-upload.json \
            -w "%{http_code}" \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${PCLOUDY_TOKEN}" \
            -F "filter=apk" \
            "https://device.pcloudy.com/api/upload_file")

          echo "pCloudy upload HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: APK upload failed"

            cat pcloudy-upload.json

            exit 1
          fi

          echo "APK uploaded successfully."


      # ============================================================
      # 18. Install + Launch APK
      # ============================================================

      - name: Install and launch APK
        id: install-app

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          RID: ${{ steps.book-device.outputs.rid }}

        run: |
          set -e

          echo "Installing APK on booked pCloudy device..."

          echo "Reservation ID: ${RID}"

          HTTP_CODE=$(curl -sS \
            -o pcloudy-install.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"rid\": \"${RID}\",
              \"filename\": \"firebase-app.apk\",
              \"grant_all_permissions\": true
            }" \
            "https://device.pcloudy.com/api/install_app")

          echo "Install API HTTP status: ${HTTP_CODE}"

          echo "Install response:"
          cat pcloudy-install.json

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: APK installation failed"
            exit 1
          fi

          # Detect explicit failure if returned by API.
          if jq -e '
            (.success? == false) or
            (.status? == false) or
            (.status? == "error")
          ' pcloudy-install.json >/dev/null 2>&1; then

            echo "ERROR: pCloudy reported installation failure"
            exit 1

          fi

          echo "APK install/launch request completed successfully."


      # ============================================================
      # 19. Release Device
      # ============================================================

      - name: Release pCloudy device
        if: ${{ always() && steps.book-device.outputs.rid != '' }}

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          RID: ${{ steps.book-device.outputs.rid }}

        run: |
          echo "Releasing pCloudy device..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-release.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"rid\": \"${RID}\"
            }" \
            "https://device.pcloudy.com/api/release_device")

          echo "Release HTTP status: ${HTTP_CODE}"

          cat pcloudy-release.json

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "WARNING: Device release API returned HTTP ${HTTP_CODE}"
          else
            echo "pCloudy device release completed."
          fi


      # ============================================================
      # 20. Upload Results
      # ============================================================

      - name: Upload pCloudy results
        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-results

          path: |
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-book.json
            pcloudy-upload.json
            pcloudy-install.json
            pcloudy-release.json

          if-no-files-found: ignore


      # ============================================================
      # 21. Upload APK Artifact
      # ============================================================

      - name: Upload APK artifact
        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:
          name: firebase-apk

          path: firebase-app.apk

          if-no-files-found: ignore
