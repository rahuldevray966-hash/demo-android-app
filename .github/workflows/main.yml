name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ==========================================================
  # STAGE 1
  # Firebase
  # Authentication + Latest Release + Download + Verify
  # ==========================================================

  stage-1-firebase:

    name: Stage 1 - Firebase

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Firebase Authentication
      # ------------------------------------------------------

      - name: Authenticate with Firebase

        uses: google-github-actions/auth@v2

        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ------------------------------------------------------
      # Get latest Firebase release
      # ------------------------------------------------------

      - name: Get latest Firebase release

        id: firebase-release

        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"

          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          echo "Calling Firebase App Distribution API..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Firebase returned invalid JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase release not found"
            cat firebase-release.json
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Firebase release found"
          echo "=========================================="

          echo "Release:"
          echo "$RELEASE_NAME"

          echo "Firebase download URL found"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ------------------------------------------------------
      # Download existing APK
      # ------------------------------------------------------

      - name: Download APK from Firebase

        shell: bash

        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Downloading existing APK from Firebase"
          echo "=========================================="

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Firebase download URL is empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: Firebase APK download failed"
            exit 1
          fi

          echo ""
          echo "Firebase APK downloaded successfully"

          ls -lh firebase-app.apk


      # ------------------------------------------------------
      # Verify APK
      # ------------------------------------------------------

      - name: Verify APK

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful"


      # ------------------------------------------------------
      # Upload APK for next stage
      # ------------------------------------------------------

      - name: Upload Firebase APK artifact

        uses: actions/upload-artifact@v4

        with:
          name: firebase-apk
          path: firebase-app.apk
          retention-days: 5


      # ------------------------------------------------------
      # Upload release JSON
      # ------------------------------------------------------

      - name: Upload Firebase release information

        uses: actions/upload-artifact@v4

        with:
          name: firebase-release
          path: firebase-release.json
          retention-days: 5


  # ==========================================================
  # STAGE 2
  # pCloudy Authentication
  # ==========================================================

  stage-2-pcloudy-auth:

    name: Stage 2 - pCloudy Authentication

    needs:
      - stage-1-firebase

    runs-on: ubuntu-latest

    steps:

      - name: Authenticate with pCloudy

        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "pCloudy Authentication"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "pCloudy authentication successful"


  # ==========================================================
  # STAGE 3
  # Get pCloudy Device List
  # ==========================================================

  stage-3-pcloudy-device-list:

    name: Stage 3 - pCloudy Device List

    needs:
      - stage-2-pcloudy-auth

    runs-on: ubuntu-latest

    steps:

      - name: Get available Android devices

        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting pCloudy Android devices"
          echo "=========================================="

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            printf '%s' "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "RAW pCloudy Device Response"
          echo "=========================================="

          cat pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Available Android Devices"
          echo "=========================================="

          jq -r '
            .. |
            objects |
            select(.full_name? != null) |
            "\(.full_name) | available=\(.available)"
          ' pcloudy-devices.json 2>/dev/null || true

          echo ""
          echo "pCloudy device list generated successfully"


      - name: Upload pCloudy device JSON

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-devices
          path: pcloudy-devices.json
          retention-days: 5


  # ==========================================================
  # STAGE 4
  # Select One Available Device
  # ==========================================================

  stage-4-select-device:

    name: Stage 4 - Select Device from JSON

    needs:
      - stage-3-pcloudy-device-list

    runs-on: ubuntu-latest

    steps:

      - name: Download pCloudy device JSON

        uses: actions/download-artifact@v4

        with:
          name: pcloudy-devices


      - name: Select first available Android device

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Selecting Device from JSON"
          echo "=========================================="

          echo ""
          echo "Available devices:"
          echo ""

          jq -r '
            .. |
            objects |
            select(.full_name? != null) |
            "\(.full_name) | available=\(.available)"
          ' pcloudy-devices.json


          echo ""
          echo "=========================================="
          echo "Searching for available Android device"
          echo "=========================================="


          SELECTED_DEVICE="$(
            jq -r '
              .. |
              objects |
              select(
                .full_name? != null
                and
                (.platform? | ascii_downcase) == "android"
                and
                .available == true
              ) |
              .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"


          if [ -z "$SELECTED_DEVICE" ]; then

            echo "ERROR: No available Android device found"

            echo ""
            echo "Available devices:"

            jq -r '
              .. |
              objects |
              select(.full_name? != null) |
              .full_name
            ' pcloudy-devices.json

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "Selected Device"
          echo "=========================================="

          echo "$SELECTED_DEVICE"


          printf '%s\n' "$SELECTED_DEVICE" > selected-device.txt


      - name: Upload selected device

        uses: actions/upload-artifact@v4

        with:
          name: selected-device
          path: selected-device.txt
          retention-days: 5


  # ==========================================================
  # STAGE 5
  # Upload APK to pCloudy
  # ==========================================================

  stage-5-upload-apk:

    name: Stage 5 - Upload APK to pCloudy

    needs:
      - stage-4-select-device

    runs-on: ubuntu-latest

    steps:

      - name: Download Firebase APK

        uses: actions/download-artifact@v4

        with:
          name: firebase-apk


      - name: Download selected device

        uses: actions/download-artifact@v4

        with:
          name: selected-device


      - name: Upload APK to pCloudy

        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase APK to pCloudy"
          echo "=========================================="

          DEVICE="$(cat selected-device.txt)"

          echo ""
          echo "Selected device:"
          echo "$DEVICE"


          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: firebase-app.apk not found"
            exit 1
          fi


          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"


          TOKEN="$(
            printf '%s' "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"


          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            exit 1
          fi


          echo "::add-mask::$TOKEN"


          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"


          echo ""
          echo "pCloudy upload HTTP status: ${HTTP_CODE}"


          if [ "$HTTP_CODE" != "200" ]; then

            echo "ERROR: pCloudy APK upload failed"

            cat pcloudy-upload.json

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "APK uploaded to pCloudy successfully"
          echo "=========================================="


      - name: Upload pCloudy upload response

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-upload-result
          path: pcloudy-upload.json
          retention-days: 5
          if-no-files-found: warn


  # ==========================================================
  # STAGE 6
  # Run Appium Test
  # ==========================================================

  stage-6-appium:

    name: Stage 6 - Appium Test

    needs:
      - stage-5-upload-apk

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Download selected device

        uses: actions/download-artifact@v4

        with:
          name: selected-device


      - name: Setup Python

        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      - name: Install Appium dependencies

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Installing Appium dependencies"
          echo "=========================================="


          python -m pip install --upgrade pip


          if [ -f requirements.txt ]; then

            pip install -r requirements.txt

          else

            pip install \
              Appium-Python-Client \
              selenium \
              pytest \
              pytest-html

          fi


          echo "Appium dependencies installed successfully"


      - name: Run Appium lifecycle test

        shell: bash

        env:

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          APP_PACKAGE: com.epam.mobitru

          PCLOUDY_APPLICATION_NAME: firebase-app.apk

        run: |

          set -euo pipefail


          PCLOUDY_DEVICE="$(cat selected-device.txt)"

          export PCLOUDY_DEVICE


          echo ""
          echo "=========================================="
          echo "Starting Appium lifecycle test"
          echo "=========================================="


          echo "Device : $PCLOUDY_DEVICE"

          echo "Package: $APP_PACKAGE"

          echo "App    : $PCLOUDY_APPLICATION_NAME"


          echo ""
          echo "=========================================="


          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml \
            --html=appium-report.html \
            --self-contained-html


          echo ""
          echo "=========================================="
          echo "APP LIFECYCLE TEST PASSED"
          echo "=========================================="


      # ------------------------------------------------------
      # Upload results
      # ------------------------------------------------------

      - name: Upload Appium test results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: appium-test-results

          path: |
            appium-results.xml
            appium-report.html
            selected-device.txt

          retention-days: 5

          if-no-files-found: warn
