name: Build, Firebase and pCloudy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  build-firebase-pcloudy:

    name: Build APK → Firebase → pCloudy
    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Java
      # ============================================================

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'


      # ============================================================
      # 3. Gradle permission
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ============================================================
      # 4. Build APK
      # ============================================================

      - name: Build APK
        run: |
          echo "Building Android APK..."

          ./gradlew assembleDebug

          echo "Build completed."


      # ============================================================
      # 5. Verify APK
      # ============================================================

      - name: Verify APK
        run: |

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"


      # ============================================================
      # 6. Firebase authentication
      # ============================================================

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ============================================================
      # 7. Install Firebase CLI
      # ============================================================

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools

          firebase --version


      # ============================================================
      # 8. Upload APK to Firebase App Distribution
      # ============================================================

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_EMAIL: ${{ secrets.FIREBASE_TESTER_EMAIL }}

        run: |

          echo "Uploading APK to Firebase..."

          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "GitHub Actions build - $GITHUB_SHA" \
            --testers "$FIREBASE_TESTER_EMAIL"

          echo "Firebase upload completed."


      # ============================================================
      # 9. Get Firebase access token
      # ============================================================

      - name: Get Firebase access token
        id: firebase-token

        run: |

          echo "Getting Firebase access token..."

          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token not generated"
            exit 1
          fi

          echo "Firebase authentication successful."

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 10. Get latest Firebase release
      # ============================================================

      - name: Get latest Firebase release
        id: firebase-release

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |

          echo "Getting latest Firebase release..."

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=1&orderBy=createTime%20desc")


          echo "$RESPONSE" > firebase-release.json

          echo "Firebase response:"
          cat firebase-release.json


          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri')


          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then

            echo "ERROR: Firebase APK download URL not found"

            exit 1

          fi


          echo "Firebase release found."

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 11. Download APK from Firebase
      # ============================================================

      - name: Download APK from Firebase
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |

          echo "Downloading APK from Firebase..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o firebase-app.apk \
            "$DOWNLOAD_URL"


          if [ ! -s firebase-app.apk ]; then

            echo "ERROR: Firebase APK download failed"

            exit 1

          fi


          echo "Firebase APK downloaded:"
          ls -lh firebase-app.apk


      # ============================================================
      # 12. Verify downloaded APK
      # ============================================================

      - name: Verify Firebase APK
        run: |

          echo "Verifying APK..."

          file firebase-app.apk


          APK_SIZE=$(stat -c%s firebase-app.apk)


          if [ "$APK_SIZE" -le 0 ]; then

            echo "ERROR: APK is empty"

            exit 1

          fi


          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful."


      # ============================================================
      # 13. pCloudy Authentication
      # ============================================================

      - name: Authenticate with pCloudy
        id: pcloudy-auth

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          echo "Authenticating with pCloudy..."


          HTTP_CODE=$(curl -sS \
            -o pcloudy-auth.json \
            -w "%{http_code}" \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")


          echo "pCloudy authentication HTTP status: $HTTP_CODE"


          if [ "$HTTP_CODE" != "200" ]; then

            echo "ERROR: pCloudy authentication failed"

            cat pcloudy-auth.json

            exit 1

          fi


          echo "pCloudy authentication response:"

          cat pcloudy-auth.json


          # pCloudy response can be an object or array
          TOKEN=$(jq -r '
            if type == "object" then
              (.token // .data.token // .accessToken)
            elif type == "array" then
              (.[0].token // .[0].data.token // .[0].accessToken)
            else
              empty
            end
          ' pcloudy-auth.json)


          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then

            echo "ERROR: Could not extract pCloudy token"

            cat pcloudy-auth.json

            exit 1

          fi


          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"


          echo "pCloudy authentication successful."


      # ============================================================
      # 14. Get pCloudy Available Android Devices
      # ============================================================

      - name: Get available Android devices
        id: devices

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |

          echo "Getting available Android devices..."


          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"duration\": 15,
              \"platform\": \"android\",
              \"available_now\": true
            }" \
            "https://device.pcloudy.com/api/devices" \
            > pcloudy-devices.json


          echo "pCloudy device list received."


          if [ ! -s pcloudy-devices.json ]; then

            echo "ERROR: Empty pCloudy device response"

            exit 1

          fi


          echo "Raw pCloudy device response:"

          cat pcloudy-devices.json


          echo ""
          echo "Available devices:"
          echo ""


          # Display device information
          jq -r '
            .. |
            objects |
            select(has("id")) |
            [
              .id,
              (.full_name // .fullName // .model // .deviceName // "unknown"),
              (.version // .osVersion // .androidVersion // "unknown")
            ] |
            @tsv
          ' pcloudy-devices.json 2>/dev/null || true


      # ============================================================
      # 15. Select Pixel 8 / Pixel 7
      # ============================================================

      - name: Select Pixel 8 or Pixel 7
        id: select-device

        run: |

          echo "Searching for available Pixel 8 / Pixel 7..."

          echo ""


          # --------------------------------------------------------
          # Pixel 8
          # --------------------------------------------------------

          PIXEL8_ID=$(jq -r '
            .. |
            objects |
            select(has("id")) |
            select(
              (
                (.full_name // .fullName // .model // .deviceName // "")
                | tostring
                | ascii_downcase
                | test("pixel[ _-]?8")
              )
            ) |
            .id
          ' pcloudy-devices.json 2>/dev/null | head -n 1)


          # --------------------------------------------------------
          # Pixel 7
          # --------------------------------------------------------

          PIXEL7_ID=$(jq -r '
            .. |
            objects |
            select(has("id")) |
            select(
              (
                (.full_name // .fullName // .model // .deviceName // "")
                | tostring
                | ascii_downcase
                | test("pixel[ _-]?7")
              )
            ) |
            .id
          ' pcloudy-devices.json 2>/dev/null | head -n 1)


          # --------------------------------------------------------
          # Prefer Pixel 8
          # --------------------------------------------------------

          if [ -n "$PIXEL8_ID" ] && [ "$PIXEL8_ID" != "null" ]; then

            DEVICE_ID="$PIXEL8_ID"

            echo "Pixel 8 found."
            echo "Selected Device ID: $DEVICE_ID"

          elif [ -n "$PIXEL7_ID" ] && [ "$PIXEL7_ID" != "null" ]; then

            DEVICE_ID="$PIXEL7_ID"

            echo "Pixel 8 not available."
            echo "Pixel 7 found."
            echo "Selected Device ID: $DEVICE_ID"

          else

            echo "ERROR: No Pixel 7 or Pixel 8 found."

            echo ""
            echo "Available devices from pCloudy:"

            jq -r '
              .. |
              objects |
              select(has("id")) |
              "\(.id) \(.full_name // .fullName // .model // .deviceName // "unknown")"
            ' pcloudy-devices.json 2>/dev/null || true

            exit 1

          fi


          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 16. Book selected pCloudy device
      # ============================================================

      - name: Book selected pCloudy device
        id: book-device

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          DEVICE_ID: ${{ steps.select-device.outputs.device_id }}

        run: |

          echo "Booking pCloudy device..."

          echo "Device ID: $DEVICE_ID"


          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"duration\": 15,
              \"id\": \"${DEVICE_ID}\"
            }" \
            "https://device.pcloudy.com/api/book_device" \
            > pcloudy-book.json


          echo "pCloudy booking response:"

          cat pcloudy-book.json


          # Extract reservation ID
          RID=$(jq -r '
            if type == "object" then
              (
                .rid //
                .reservationId //
                .reservation_id //
                .data.rid //
                .data.reservationId //
                .data.reservation_id
              )
            elif type == "array" then
              (
                .[0].rid //
                .[0].reservationId //
                .[0].reservation_id //
                .[0].data.rid //
                .[0].data.reservationId
              )
            else
              empty
            end
          ' pcloudy-book.json)


          if [ -z "$RID" ] || [ "$RID" = "null" ]; then

            echo "ERROR: Could not get pCloudy reservation ID."

            cat pcloudy-book.json

            exit 1

          fi


          echo "Reservation ID: $RID"

          echo "rid=$RID" >> "$GITHUB_OUTPUT"

          echo "pCloudy device booked successfully."


      # ============================================================
      # 17. Upload APK to pCloudy Cloud Drive
      # ============================================================

      - name: Upload APK to pCloudy
        id: upload-pcloudy

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |

          echo "Uploading APK to pCloudy cloud drive..."


          HTTP_CODE=$(curl -sS \
            -o pcloudy-upload.json \
            -w "%{http_code}" \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${PCLOUDY_TOKEN}" \
            -F "filter=all" \
            "https://device.pcloudy.com/api/upload_file")


          echo "pCloudy upload HTTP status: $HTTP_CODE"


          echo "pCloudy upload response:"

          cat pcloudy-upload.json


          if [ "$HTTP_CODE" != "200" ]; then

            echo "ERROR: pCloudy APK upload failed"

            exit 1

          fi


          echo "APK uploaded to pCloudy successfully."


      # ============================================================
      # 18. Install and Launch APK on SAME booked device
      # ============================================================

      - name: Install and launch APK on selected device
        id: install-app

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          RID: ${{ steps.book-device.outputs.rid }}

        run: |

          echo "Installing APK on booked pCloudy device..."

          echo "Reservation ID: $RID"

          echo "APK: firebase-app.apk"


          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"rid\": \"${RID}\",
              \"filename\": \"firebase-app.apk\",
              \"grant_all_permissions\": true
            }" \
            "https://device.pcloudy.com/api/install_app" \
            > pcloudy-install.json


          echo "pCloudy install response:"

          cat pcloudy-install.json


          # Check obvious failure responses
          if jq -e '
            (.statusCode? == 400) or
            (.statusCode? == 401) or
            (.status? == "error") or
            (.success? == false)
          ' pcloudy-install.json >/dev/null 2>&1; then

            echo "ERROR: APK installation failed."

            exit 1

          fi


          echo "APK installation/launch request completed successfully."


      # ============================================================
      # 19. Release pCloudy device
      # ============================================================

      - name: Release pCloudy device
        if: ${{ always() && steps.book-device.outputs.rid != '' }}

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          RID: ${{ steps.book-device.outputs.rid }}

        run: |

          echo "Releasing pCloudy device..."

          echo "Reservation ID: $RID"


          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${PCLOUDY_TOKEN}\",
              \"rid\": \"${RID}\"
            }" \
            "https://device.pcloudy.com/api/release_device" \
            > pcloudy-release.json


          echo "pCloudy release response:"

          cat pcloudy-release.json


          echo "pCloudy device release request completed."


      # ============================================================
      # 20. Upload logs/results as GitHub Artifact
      # ============================================================

      - name: Upload pCloudy results
        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-results

          path: |
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-book.json
            pcloudy-upload.json
            pcloudy-install.json
            pcloudy-release.json
            firebase-release.json

          if-no-files-found: warn


      # ============================================================
      # 21. Upload final APK artifact
      # ============================================================

      - name: Upload Firebase APK artifact
        if: ${{ always() }}

        uses: actions/upload-artifact@v4

        with:
          name: android-firebase-apk

          path: firebase-app.apk

          if-no-files-found: warn
