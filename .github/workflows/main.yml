name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ============================================================
  # STAGE 1 - CHECKOUT
  # ============================================================

  checkout:
    name: Stage 1 - Checkout
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


  # ============================================================
  # STAGE 2 - FIREBASE
  # Authentication
  # Access Token
  # Latest Release
  # Download APK
  # Verify APK
  # ============================================================

  firebase:
    name: Stage 2 - Firebase
    runs-on: ubuntu-latest

    needs:
      - checkout

    steps:

      # ----------------------------------------------------------
      # Checkout again because every GitHub Actions job
      # runs on a fresh runner
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Firebase Authentication
      # ----------------------------------------------------------

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ----------------------------------------------------------
      # Get Firebase Access Token
      # ----------------------------------------------------------

      - name: Get Firebase access token
        id: firebase-token
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Firebase Authentication"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Could not get Firebase access token"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ----------------------------------------------------------
      # Get Latest Firebase Release
      # ----------------------------------------------------------

      - name: Get latest Firebase release
        id: firebase-release
        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ "$APP_ID" != *":ios:"* ]] && [[ "$APP_ID" != *":android:"* ]]; then
            echo "WARNING: Firebase App ID does not look like standard Android/iOS format"
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Firebase returned invalid JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase release found"
            cat firebase-release.json
            exit 1
          fi

          echo "Firebase release found:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ----------------------------------------------------------
      # Download APK
      # ----------------------------------------------------------

      - name: Download APK from Firebase
        shell: bash

        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading APK from Firebase"
          echo "=========================================="

          curl \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: Firebase APK download failed"
            exit 1
          fi

          echo "APK downloaded successfully"

          ls -lh firebase-app.apk


      # ----------------------------------------------------------
      # Verify APK
      # ----------------------------------------------------------

      - name: Verify APK
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful"


      # ----------------------------------------------------------
      # Save Firebase APK for next jobs
      # ----------------------------------------------------------

      - name: Upload Firebase APK artifact
        uses: actions/upload-artifact@v4

        with:
          name: firebase-apk
          path: |
            firebase-app.apk
            firebase-release.json


  # ============================================================
  # STAGE 3 - PCLOUDY AUTHENTICATION
  # ============================================================

  pcloudy-auth:
    name: Stage 3 - pCloudy Authentication
    runs-on: ubuntu-latest

    needs:
      - firebase

    steps:

      - name: Authenticate with pCloudy
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "pCloudy Authentication"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "pCloudy authentication successful"

          echo "::add-mask::$TOKEN"

      - name: Upload pCloudy authentication response
        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-auth
          path: pcloudy-auth.json


  # ============================================================
  # STAGE 4 - PCLOUDY DEVICE LIST
  # ============================================================

  device-list:
    name: Stage 4 - pCloudy Device List
    runs-on: ubuntu-latest

    needs:
      - pcloudy-auth

    steps:

      - name: Get available pCloudy Android devices
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting pCloudy Android device list"
          echo "=========================================="

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            printf '%s' "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "RAW pCloudy Android Device Response"
          echo "=========================================="

          cat pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Available Android Devices"
          echo "=========================================="

          jq -r '
            .result.models[]?
            | select(
                (.platform // "" | ascii_downcase) == "android"
                and (.available == true)
              )
            | "\(.full_name) | Android \(.version) | available=\(.available)"
          ' pcloudy-devices.json

      - name: Upload device JSON
        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-device-list
          path: pcloudy-devices.json


  # ============================================================
  # STAGE 5 - SELECT DEVICE FROM JSON
  #
  # IMPORTANT:
  # APK requires SDK 28.
  #
  # Therefore:
  # Android 9 = API 28
  #
  # We select available Android 9+
  # ============================================================

  select-device:
    name: Stage 5 - Select Compatible Device
    runs-on: ubuntu-latest

    needs:
      - device-list

    steps:

      - name: Download device JSON
        uses: actions/download-artifact@v4

        with:
          name: pcloudy-device-list


      - name: Select compatible Android device
        id: select
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Selecting compatible Android device"
          echo "=========================================="

          echo ""
          echo "Available Android devices:"
          echo ""

          jq -r '
            .result.models[]?
            | select(
                (.platform // "" | ascii_downcase) == "android"
                and (.available == true)
              )
            | "\(.full_name) | Android \(.version)"
          ' pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Filtering Android 9+ devices"
          echo "=========================================="

          DEVICE="$(
            jq -r '
              .result.models[]?
              | select(
                  (.platform // "" | ascii_downcase) == "android"
                  and (.available == true)
                  and (
                    ((.version // "0") | split(".")[0] | tonumber) >= 9
                  )
                )
              | .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"

          if [ -z "$DEVICE" ]; then
            echo ""
            echo "ERROR: No available Android 9+ device found"
            echo ""
            echo "The APK requires minimum SDK 28."
            echo "Android 9 = API 28."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Selected Device"
          echo "=========================================="

          echo "$DEVICE"

          echo "$DEVICE" > selected-device.txt


      - name: Upload selected device
        uses: actions/upload-artifact@v4

        with:
          name: selected-device
          path: selected-device.txt


  # ============================================================
  # STAGE 6 - UPLOAD APK TO PCLOUDY
  # ============================================================

  upload-apk:
    name: Stage 6 - Upload APK to pCloudy
    runs-on: ubuntu-latest

    needs:
      - select-device

    steps:

      - name: Download Firebase APK
        uses: actions/download-artifact@v4

        with:
          name: firebase-apk


      - name: Authenticate and upload APK to pCloudy
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase APK to pCloudy"
          echo "=========================================="

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            printf '%s' "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not authenticate with pCloudy"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "APK uploaded to pCloudy successfully"


      - name: Upload pCloudy upload response
        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-upload
          path: pcloudy-upload.json


  # ============================================================
  # STAGE 7 - PYTHON + APPIUM
  # ============================================================

  appium-setup:
    name: Stage 7 - Setup Python and Appium
    runs-on: ubuntu-latest

    needs:
      - upload-apk

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Python/Appium dependencies"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              Appium-Python-Client \
              selenium \
              pytest \
              pytest-html
          fi

          echo "Dependencies installed successfully"


  # ============================================================
  # STAGE 8 - RUN APPIUM
  # ============================================================

  appium-test:
    name: Stage 8 - Run Appium Lifecycle Test
    runs-on: ubuntu-latest

    needs:
      - select-device
      - upload-apk
      - appium-setup

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download selected device
        uses: actions/download-artifact@v4

        with:
          name: selected-device


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              Appium-Python-Client \
              selenium \
              pytest \
              pytest-html
          fi


      - name: Run Appium lifecycle test
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          APP_PACKAGE: com.epam.mobitru

        run: |
          set -euo pipefail

          DEVICE="$(cat selected-device.txt)"

          export PCLOUDY_DEVICE="$DEVICE"

          echo ""
          echo "=========================================="
          echo "Starting Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"
          echo "App    : firebase-app.apk"

          echo "=========================================="
          echo ""

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml \
            --html=appium-report.html \
            --self-contained-html

          echo ""
          echo "=========================================="
          echo "Appium lifecycle test completed"
          echo "=========================================="


      - name: Upload Appium results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: appium-test-results
          path: |
            appium-results.xml
            appium-report.html
            selected-device.txt

          if-no-files-found: warn
