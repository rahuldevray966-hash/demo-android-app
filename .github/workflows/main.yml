name: Android Firebase to pCloudy Sequential Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PACKAGE: com.epam.mobitru
  APP_NAME: firebase-app.apk
  PCLOUDY_DURATION: 30


# ============================================================
# JOB 1
# Firebase Authentication + Latest Release + APK Download
# ============================================================

jobs:

  firebase:

    name: Stage 1 - Firebase
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Firebase Authentication
      # --------------------------------------------------------

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # --------------------------------------------------------
      # Firebase Access Token
      # --------------------------------------------------------

      - name: Get Firebase access token
        id: firebase-token
        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting Firebase access token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # --------------------------------------------------------
      # Get Latest Firebase Release
      # --------------------------------------------------------

      - name: Get latest Firebase release
        id: release

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          DOWNLOAD_URL="$(
            echo "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            echo "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then

            echo "ERROR: Firebase release not found"

            cat firebase-release.json

            exit 1

          fi

          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Download APK
      # --------------------------------------------------------

      - name: Download Firebase APK

        env:
          DOWNLOAD_URL: ${{ steps.release.outputs.download_url }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Downloading Firebase APK"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --output firebase-app.apk \
            "$DOWNLOAD_URL"

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          ls -lh firebase-app.apk


      # --------------------------------------------------------
      # Verify APK
      # --------------------------------------------------------

      - name: Verify Firebase APK

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          file firebase-app.apk

          SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${SIZE} bytes"
          echo "APK verification successful"


      # --------------------------------------------------------
      # Upload APK Artifact
      # --------------------------------------------------------

      - name: Store APK for next job

        uses: actions/upload-artifact@v4

        with:
          name: firebase-apk
          path: |
            firebase-app.apk
            firebase-release.json


# ============================================================
# JOB 2
# pCloudy Authentication + Device List + APK Upload
# ============================================================

  pcloudy:

    name: Stage 2 - pCloudy Setup
    runs-on: ubuntu-latest

    needs:
      - firebase

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download Firebase APK
      # --------------------------------------------------------

      - name: Download Firebase APK artifact

        uses: actions/download-artifact@v4

        with:
          name: firebase-apk


      # --------------------------------------------------------
      # pCloudy Authentication
      # --------------------------------------------------------

      - name: Authenticate with pCloudy

        id: auth

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Authenticating with pCloudy"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            echo "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then

            echo "ERROR: pCloudy authentication failed"

            cat pcloudy-auth.json

            exit 1

          fi

          echo "::add-mask::$TOKEN"

          echo "pCloudy authentication successful"


      # --------------------------------------------------------
      # Get Available Device List
      # --------------------------------------------------------

      - name: Get pCloudy device list

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting pCloudy device list"
          echo "=========================================="

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            echo "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not get pCloudy token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{
                \"token\":\"${TOKEN}\",
                \"duration\":30,
                \"platform\":\"Android\",
                \"available_now\":true
              }" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "pCloudy Device Response"
          echo "=========================================="

          jq '.' pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Available Devices"
          echo "=========================================="

          jq -r '
            ..
            | objects
            | select(.full_name? != null)
            | "\(.full_name) | id=\(.id // "N/A") | available=\(.available // "N/A")"
          ' pcloudy-devices.json || true


      # --------------------------------------------------------
      # Upload APK to pCloudy
      # --------------------------------------------------------

      - name: Upload APK to pCloudy

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Uploading APK to pCloudy"
          echo "=========================================="

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: firebase-app.apk not found"
            exit 1
          fi

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            echo "$AUTH_RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          HTTP_CODE="$(
            curl \
              --http1.1 \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              --output pcloudy-upload.json \
              --write-out "%{http_code}" \
              --request POST \
              --form "file=@firebase-app.apk" \
              --form "source_type=raw" \
              --form "token=${TOKEN}" \
              --form "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo "ERROR: pCloudy upload failed"

            cat pcloudy-upload.json

            exit 1

          fi

          echo "APK uploaded successfully"


      # --------------------------------------------------------
      # Store pCloudy setup information
      # --------------------------------------------------------

      - name: Upload pCloudy setup artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-setup

          path: |
            pcloudy-devices.json
            pcloudy-auth.json
            pcloudy-upload.json

          if-no-files-found: warn


# ============================================================
# JOB 3
# Sequential Device Testing
# ============================================================

  device-tests:

    name: Stage 3 - Sequential Device Tests
    runs-on: ubuntu-latest

    needs:
      - firebase
      - pcloudy

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download Firebase APK
      # --------------------------------------------------------

      - name: Download Firebase APK

        uses: actions/download-artifact@v4

        with:
          name: firebase-apk


      # --------------------------------------------------------
      # Download pCloudy setup
      # --------------------------------------------------------

      - name: Download pCloudy setup

        uses: actions/download-artifact@v4

        with:
          name: pcloudy-setup


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------------

      - name: Install Appium dependencies

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then

            echo "ERROR: requirements.txt not found"

            exit 1

          fi

          pip install -r requirements.txt

          echo "Dependencies installed"


      # --------------------------------------------------------
      # Validate customer config
      # --------------------------------------------------------

      - name: Validate customer device configuration

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Validating config/devices.json"
          echo "=========================================="

          if [ ! -f config/devices.json ]; then

            echo "ERROR: config/devices.json not found"

            exit 1

          fi

          jq empty config/devices.json

          DEVICE_COUNT="$(
            jq '[.devices[]? | select(.enabled == true)] | length' \
              config/devices.json
          )"

          if [ "$DEVICE_COUNT" -eq 0 ]; then

            echo "ERROR: No enabled devices configured"

            exit 1

          fi

          echo "Enabled devices: $DEVICE_COUNT"

          jq -r '
            .devices[]?
            | select(.enabled == true)
            | .name
          ' config/devices.json


      # --------------------------------------------------------
      # Fresh pCloudy authentication
      # --------------------------------------------------------

      - name: Authenticate with pCloudy

        id: device-auth

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Fresh pCloudy authentication"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(
            echo "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then

            echo "ERROR: Fresh pCloudy authentication failed"

            exit 1

          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "Fresh pCloudy token received successfully"


      # --------------------------------------------------------
      # Sequential Device Execution
      # --------------------------------------------------------

      - name: Run Appium sequentially on selected devices

        env:

          PCLOUDY_TOKEN: ${{ steps.device-auth.outputs.token }}

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          APP_PACKAGE: com.epam.mobitru

          PCLOUDY_DURATION: 30

        run: |

          set -euo pipefail

          mkdir -p results
          mkdir -p performance

          echo "=========================================="
          echo "Starting sequential performance execution"
          echo "=========================================="


          # ==================================================
          # Get FRESH device list
          # ==================================================

          echo ""
          echo "Getting fresh pCloudy device list..."

          DEVICE_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{
                \"token\":\"${PCLOUDY_TOKEN}\",
                \"duration\":${PCLOUDY_DURATION},
                \"platform\":\"Android\",
                \"available_now\":true
              }" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$DEVICE_RESPONSE" > pcloudy-devices.json

          echo "pCloudy device list received."


          # ==================================================
          # Loop through enabled devices
          # ==================================================

          jq -r '
            .devices[]?
            | select(.enabled == true)
            | .name
          ' config/devices.json |

          while IFS= read -r DEVICE_NAME; do

            echo ""
            echo "##################################################"
            echo "Starting device"
            echo "##################################################"

            echo "Device: $DEVICE_NAME"

            SAFE_NAME="$(
              echo "$DEVICE_NAME" |
              tr '[:upper:]' '[:lower:]' |
              sed 's/[^a-z0-9]/-/g' |
              sed 's/-\{2,\}/-/g' |
              sed 's/^-//' |
              sed 's/-$//'
            )"

            DEVICE_DIR="results/${SAFE_NAME}"

            mkdir -p "$DEVICE_DIR"

            echo "Result directory: $DEVICE_DIR"


            # ==================================================
            # 1. Find Device ID
            # ==================================================

            echo ""
            echo "[1/7] Finding device in pCloudy response"

            DEVICE_ID="$(
              jq -r --arg name "$DEVICE_NAME" '
                ..
                | objects
                | select(.full_name? == $name)
                | .id?
              ' pcloudy-devices.json |
              head -n 1
            )"

            if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then

              echo "ERROR: Device not found in pCloudy device list"

              echo "Requested device:"
              echo "$DEVICE_NAME"

              echo ""
              echo "Available matching names:"

              jq -r '
                ..
                | objects
                | select(.full_name? != null)
                | .full_name
              ' pcloudy-devices.json |
              sort -u

              exit 1

            fi

            echo "Device ID: $DEVICE_ID"


            # ==================================================
            # 2. Book Device
            # ==================================================

            echo ""
            echo "[2/7] Booking device"

            BOOK_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg device "$DEVICE_ID" \
                --argjson duration "$PCLOUDY_DURATION" \
                '{
                  token: $token,
                  device: $device,
                  duration: $duration
                }'
            )"

            echo "Booking request:"
            echo "$BOOK_PAYLOAD" |
              jq 'del(.token)'

            BOOK_RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$BOOK_PAYLOAD" \
                "https://device.pcloudy.com/api/book_device"
            )"

            printf '%s\n' "$BOOK_RESPONSE" \
              > "${DEVICE_DIR}/book-response.json"

            echo "Book response saved"

            echo "Booking response:"
            cat "${DEVICE_DIR}/book-response.json"


            # ==================================================
            # Extract reservation ID
            # ==================================================

            RID="$(
              echo "$BOOK_RESPONSE" |
              jq -r '
                .result.rid //
                .result.reservationId //
                .rid //
                .reservationId //
                empty
              ' |
              head -n 1
            )"

            if [ -z "$RID" ] || [ "$RID" = "null" ]; then

              echo ""
              echo "ERROR: Could not extract reservation ID"

              echo "Full booking response:"
              cat "${DEVICE_DIR}/book-response.json"

              echo ""
              echo "NOTE:"
              echo "The exact pCloudy booking API response has been"
              echo "saved as an artifact for diagnosis."

              exit 1

            fi

            echo "Reservation ID: $RID"


            # ==================================================
            # 3. Start Performance Data
            # ==================================================

            echo ""
            echo "[3/7] Starting performance data"

            PERFORMANCE_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RID" \
                --arg pkg "$APP_PACKAGE" \
                '{
                  token: $token,
                  rid: $rid,
                  pkg: $pkg
                }'
            )"

            PERFORMANCE_RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$PERFORMANCE_PAYLOAD" \
                "https://device.pcloudy.com/api/start_performance_data"
            )"

            printf '%s\n' "$PERFORMANCE_RESPONSE" \
              > "${DEVICE_DIR}/performance-start.json"

            echo "Performance monitoring response:"
            cat "${DEVICE_DIR}/performance-start.json"

            echo "Performance monitoring started"


            # ==================================================
            # 4. Run Appium Test
            # ==================================================

            echo ""
            echo "[4/7] Running Appium lifecycle test"

            export PCLOUDY_DEVICE="$DEVICE_NAME"

            set +e

            pytest \
              automation/test_app_lifecycle.py \
              -v \
              --tb=short \
              --junitxml="${DEVICE_DIR}/appium-results.xml" \
              --html="${DEVICE_DIR}/appium-report.html" \
              --self-contained-html

            TEST_EXIT_CODE=$?

            set -e

            echo "Appium exit code: $TEST_EXIT_CODE"


            # ==================================================
            # 5. Get Performance File List
            # ==================================================

            echo ""
            echo "[5/7] Getting performance file list"

            FILE_LIST_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RID" \
                '{
                  token: $token,
                  rid: $rid
                }'
            )"

            FILE_LIST_RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$FILE_LIST_PAYLOAD" \
                "https://device.pcloudy.com/api/manual_access_files_list"
            )"

            printf '%s\n' "$FILE_LIST_RESPONSE" \
              > "${DEVICE_DIR}/performance-file-list.json"

            echo "Performance file list received"


            # ==================================================
            # 6. Download Performance Files
            # ==================================================

            echo ""
            echo "[6/7] Downloading performance files"

            mkdir -p "${DEVICE_DIR}/performance"

            mapfile -t PERFORMANCE_FILES < <(
              echo "$FILE_LIST_RESPONSE" |
              jq -r '
                ..
                | objects
                | .filename?
                | select(. != null)
              ' 2>/dev/null |
              sort -u
            )

            if [ "${#PERFORMANCE_FILES[@]}" -eq 0 ]; then

              echo "WARNING: No performance files returned"

            else

              for FILENAME in "${PERFORMANCE_FILES[@]}"; do

                echo "Downloading: $FILENAME"

                SAFE_FILE="$(basename "$FILENAME")"

                DOWNLOAD_PAYLOAD="$(
                  jq -n \
                    --arg token "$PCLOUDY_TOKEN" \
                    --arg rid "$RID" \
                    --arg filename "$FILENAME" \
                    '{
                      token: $token,
                      rid: $rid,
                      filename: $filename
                    }'
                )"

                curl \
                  --silent \
                  --show-error \
                  --fail-with-body \
                  --request POST \
                  --header "Content-Type: application/json" \
                  --data "$DOWNLOAD_PAYLOAD" \
                  "https://device.pcloudy.com/api/download_manual_access_data" \
                  --output "${DEVICE_DIR}/performance/${SAFE_FILE}"

                echo "Downloaded: ${SAFE_FILE}"

              done

            fi


            # ==================================================
            # 7. Release Device
            # ==================================================

            echo ""
            echo "[7/7] Releasing device"

            RELEASE_PAYLOAD="$(
              jq -n \
                --arg token "$PCLOUDY_TOKEN" \
                --arg rid "$RID" \
                '{
                  token: $token,
                  rid: $rid
                }'
            )"

            RELEASE_RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                --request POST \
                --header "Content-Type: application/json" \
                --data "$RELEASE_PAYLOAD" \
                "https://device.pcloudy.com/api/release_device"
            )"

            printf '%s\n' "$RELEASE_RESPONSE" \
              > "${DEVICE_DIR}/release-response.json"

            echo "Device released"

            echo ""
            echo "##################################################"
            echo "Device completed"
            echo "##################################################"

            echo "Device : $DEVICE_NAME"
            echo "RID    : $RID"
            echo "Result : $TEST_EXIT_CODE"


            # --------------------------------------------------
            # Continue to next device
            # --------------------------------------------------

            if [ "$TEST_EXIT_CODE" -ne 0 ]; then

              echo ""
              echo "WARNING: Appium test failed on $DEVICE_NAME"
              echo "Continuing to next configured device..."

            fi

          done


      # --------------------------------------------------------
      # Upload all results
      # --------------------------------------------------------

      - name: Upload Appium and Performance Results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: pcloudy-appium-performance-results

          path: |
            results/
            performance/
            config/devices.json
            pcloudy-devices.json

          if-no-files-found: warn
