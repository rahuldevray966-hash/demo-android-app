name: Build, Firebase Distribution and pCloud Upload

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-firebase-pcloud:
    name: Build APK, Upload to Firebase and pCloud
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Java 22
      # ----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'


      # ----------------------------------------
      # 3. Make Gradle executable
      # ----------------------------------------
      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ----------------------------------------
      # 4. Build NEW Android APK
      # ----------------------------------------
      - name: Build APK
        run: ./gradlew assembleDebug


      # ----------------------------------------
      # 5. Verify generated APK
      # ----------------------------------------
      - name: Verify APK
        run: |
          echo "Checking generated APK..."

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"


      # ----------------------------------------
      # 6. Authenticate with Firebase
      # ----------------------------------------
      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ----------------------------------------
      # 7. Install Firebase CLI
      # ----------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      # ----------------------------------------
      # 8. Upload NEW APK to Firebase
      # ----------------------------------------
      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

        run: |
          echo "Uploading new APK to Firebase App Distribution..."

          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "Automated GitHub Actions build" \
            --testers "rahuldevray966@gmail.com"

          echo "New APK uploaded to Firebase successfully"


      # ----------------------------------------
      # 9. Get Firebase access token
      # ----------------------------------------
      - name: Get Firebase access token
        id: firebase-auth
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get Firebase access token"
            exit 1
          fi

          echo "Firebase authentication successful"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 10. Get latest Firebase release
      # ----------------------------------------
      - name: Get latest Firebase release
        id: firebase-release
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}

        run: |

          echo "Getting latest Firebase release..."

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=1&orderBy=createTime%20desc")

          echo "$RESPONSE" > firebase-release.json

          echo "Firebase release response received"

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "No Firebase release download URL found"
            cat firebase-release.json
            exit 1
          fi

          echo "Latest Firebase release found"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 11. Download latest APK from Firebase
      # ----------------------------------------
      - name: Download APK from Firebase
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |

          echo "Downloading APK from Firebase..."

          curl -fL \
            -o firebase-app.apk \
            "$DOWNLOAD_URL"

          if [ ! -s firebase-app.apk ]; then
            echo "Firebase APK download failed"
            exit 1
          fi

          echo "Firebase APK downloaded successfully"

          ls -lh firebase-app.apk


      # ----------------------------------------
      # 12. Verify Firebase APK
      # ----------------------------------------
      - name: Verify Firebase APK
        run: |

          echo "Verifying Firebase APK..."

          file firebase-app.apk

          APK_SIZE=$(stat -c%s firebase-app.apk)

          if [ "$APK_SIZE" -le 0 ]; then
            echo "APK file is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"
          echo "Firebase APK verification successful"


      # ----------------------------------------
      # 13. Authenticate with pCloud
      # ----------------------------------------
      - name: Authenticate with pCloud
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          echo "Authenticating with pCloud..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-auth.json \
            -w "%{http_code}" \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          echo "pCloud authentication HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "pCloud authentication failed"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "pCloud authentication successful"


      # ----------------------------------------
      # 14. Get pCloud access token
      # ----------------------------------------
      - name: Get pCloud access token
        id: pcloud-auth
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          echo "Getting pCloud access token..."

          PCLOUDY_TOKEN=$(curl -sS \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access" \
            | jq -r '.[].token')

          if [ -z "$PCLOUDY_TOKEN" ] || [ "$PCLOUDY_TOKEN" = "null" ]; then
            echo "Failed to get pCloud access token"
            exit 1
          fi

          echo "pCloud access token generated successfully"

          echo "token=$PCLOUDY_TOKEN" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 15. Upload Firebase APK to pCloud
      # ----------------------------------------
      - name: Upload APK to pCloud
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloud-auth.outputs.token }}

        run: |

          echo "Uploading Firebase APK to pCloud..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-upload.json \
            -w "%{http_code}" \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${PCLOUDY_TOKEN}" \
            -F "filter=all" \
            "https://device.pcloudy.com/api/upload_file")

          echo "pCloud upload HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "pCloud APK upload failed"
            echo "Response:"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "Firebase APK uploaded to pCloud successfully"


      # ----------------------------------------
      # 16. Upload APK to GitHub Artifact
      # ----------------------------------------
      - name: Upload APK to GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-apk
          path: firebase-app.apk
