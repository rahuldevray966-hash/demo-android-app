name: Build, Firebase and pCloud

on:
  push:
    branches:
      - mainn

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firebase-pcloud:
    name: Build APK → Firebase → pCloud
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Java 22
      # ----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'


      # ----------------------------------------
      # 3. Make Gradle executable
      # ----------------------------------------
      - name: Make Gradle executable
        run: chmod +x ./gradlew


      # ----------------------------------------
      # 4. Build NEW APK
      # ----------------------------------------
      - name: Build APK
        run: ./gradlew assembleDebug


      # ----------------------------------------
      # 5. Verify APK
      # ----------------------------------------
      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"


      # ----------------------------------------
      # 6. Authenticate with Firebase
      # ----------------------------------------
      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ----------------------------------------
      # 7. Install Firebase CLI
      # ----------------------------------------
      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      # ----------------------------------------
      # 8. Upload NEW APK to Firebase
      # ----------------------------------------
      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_EMAIL: ${{ secrets.FIREBASE_TESTER_EMAIL }}

        run: |
          echo "Uploading NEW APK to Firebase..."

          firebase appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "GitHub Actions build - $GITHUB_SHA" \
            --testers "$FIREBASE_TESTER_EMAIL"

          echo "Firebase upload completed successfully"


      # ----------------------------------------
      # 9. Get Firebase access token
      # ----------------------------------------
      - name: Get Firebase access token
        id: firebase-token
        run: |
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Could not get Firebase access token"
            exit 1
          fi

          echo "Firebase authentication successful"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 10. Get latest Firebase release
      # ----------------------------------------
      - name: Get latest Firebase release
        id: firebase-release
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          echo "Getting latest Firebase release..."

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            "https://firebaseappdistribution.googleapis.com/v1/projects/${FIREBASE_PROJECT_NUMBER}/apps/${FIREBASE_APP_ID}/releases?pageSize=1&orderBy=createTime%20desc")

          echo "$RESPONSE" > firebase-release.json

          echo "Firebase API response:"
          cat firebase-release.json

          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.releases[0].binaryDownloadUri')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: No Firebase APK download URL found"
            exit 1
          fi

          echo "Firebase release found"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 11. Download APK from Firebase
      # ----------------------------------------
      - name: Download APK from Firebase
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          echo "Downloading APK from Firebase..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o firebase-app.apk \
            "$DOWNLOAD_URL"

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: Firebase APK download failed"
            exit 1
          fi

          echo "Firebase APK downloaded successfully:"
          ls -lh firebase-app.apk


      # ----------------------------------------
      # 12. Verify downloaded APK
      # ----------------------------------------
      - name: Verify Firebase APK
        run: |
          echo "Verifying downloaded APK..."

          file firebase-app.apk

          APK_SIZE=$(stat -c%s firebase-app.apk)

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK file is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"
          echo "APK verification successful"


      # ----------------------------------------
      # 13. Authenticate with pCloud
      # ----------------------------------------
      - name: Authenticate with pCloud
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          echo "Authenticating with pCloud..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-auth.json \
            -w "%{http_code}" \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access")

          echo "pCloud authentication HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloud authentication failed"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "pCloud authentication successful"


      # ----------------------------------------
      # 14. Get pCloud access token
      # ----------------------------------------
      - name: Get pCloud access token
        id: pcloud-token
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          echo "Getting pCloud access token..."

          PCLOUDY_TOKEN=$(curl -sS \
            -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
            "https://device.pcloudy.com/api/access" \
            | jq -r '.[].token')

          if [ -z "$PCLOUDY_TOKEN" ] || [ "$PCLOUDY_TOKEN" = "null" ]; then
            echo "ERROR: Failed to get pCloud access token"
            exit 1
          fi

          echo "pCloud access token generated successfully"

          echo "token=$PCLOUDY_TOKEN" >> "$GITHUB_OUTPUT"


      # ----------------------------------------
      # 15. Upload Firebase APK to pCloud
      # ----------------------------------------
      - name: Upload APK to pCloud
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloud-token.outputs.token }}

        run: |
          echo "Uploading APK to pCloud..."

          HTTP_CODE=$(curl -sS \
            -o pcloudy-upload.json \
            -w "%{http_code}" \
            -X POST \
            -F "file=@firebase-app.apk" \
            -F "source_type=raw" \
            -F "token=${PCLOUDY_TOKEN}" \
            -F "filter=all" \
            "https://device.pcloudy.com/api/upload_file")

          echo "pCloud upload HTTP status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloud APK upload failed"
            echo "Response:"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "APK uploaded to pCloud successfully"


      # ----------------------------------------
      # 16. Upload APK to GitHub Artifact
      # ----------------------------------------
      - name: Upload APK to GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-firebase-apk
          path: firebase-app.apk
          if-no-files-found: error
