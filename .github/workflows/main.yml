name: Task 4 - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


# ==========================================================
# STAGE 1
# Checkout
# ==========================================================

jobs:

  checkout:
    name: "Stage 1 - Checkout"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


  # ========================================================
  # STAGE 2
  # Firebase
  # Authentication
  # Access Token
  # Latest Release
  # Download APK
  # Verify APK
  # ========================================================

  firebase:
    name: "Stage 2 - Firebase"
    runs-on: ubuntu-latest
    needs: checkout

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # Firebase Authentication
      # ------------------------------------------

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ------------------------------------------
      # Get Firebase Access Token
      # ------------------------------------------

      - name: Get Firebase access token
        id: firebase-token
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting Firebase access token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ------------------------------------------
      # Get Latest Firebase Release
      # ------------------------------------------

      - name: Get latest Firebase release
        id: firebase-release
        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"
          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID does not look like an Android Firebase App ID"
            exit 1
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          echo "Calling Firebase App Distribution API..."

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! echo "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Firebase returned invalid JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            echo "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            echo "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase Android release found"
            cat firebase-release.json
            exit 1
          fi

          echo "=========================================="
          echo "Firebase release found"
          echo "=========================================="

          echo "Release:"
          echo "$RELEASE_NAME"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # ------------------------------------------
      # Download APK
      # ------------------------------------------

      - name: Download APK from Firebase
        shell: bash

        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Downloading APK from Firebase"
          echo "=========================================="

          curl \
            --fail-with-body \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          echo "APK downloaded successfully"

          ls -lh firebase-app.apk


      # ------------------------------------------
      # Verify APK
      # ------------------------------------------

      - name: Verify APK
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"
          echo "APK verification successful"


      # ------------------------------------------
      # Save Firebase files
      # ------------------------------------------

      - name: Upload Firebase artifacts
        uses: actions/upload-artifact@v4

        with:
          name: firebase-apk
          path: |
            firebase-app.apk
            firebase-release.json


  # ========================================================
  # STAGE 3
  # pCloudy Authentication
  # ========================================================

  pcloudy-auth:
    name: "Stage 3 - pCloudy Authentication"
    runs-on: ubuntu-latest
    needs: firebase

    steps:

      - name: Authenticate with pCloudy
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Authenticating with pCloudy"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          echo "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(echo "$RESPONSE" | jq -r '.result.token // empty')"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "pCloudy authentication successful"

      - name: Upload pCloudy authentication response
        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-auth
          path: pcloudy-auth.json


  # ========================================================
  # STAGE 4
  # pCloudy Device List
  # ========================================================

  device-list:
    name: "Stage 4 - pCloudy Device List"
    runs-on: ubuntu-latest
    needs: pcloudy-auth

    steps:

      - name: Get available pCloudy Android devices
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Getting pCloudy Android device list"
          echo "=========================================="

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(echo "$AUTH_RESPONSE" | jq -r '.result.token // empty')"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: pCloudy authentication failed"
            echo "$AUTH_RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"

          echo "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "RAW pCloudy Android device response"
          echo "=========================================="

          cat pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Available Android devices"
          echo "=========================================="

          jq -r '
            .result.models[]?
            | select(.available == true)
            | "\(.full_name) | available=\(.available)"
          ' pcloudy-devices.json || true

      - name: Upload device list
        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-device-list
          path: pcloudy-devices.json


  # ========================================================
  # STAGE 5
  # Select ONE available Android device
  # ========================================================

  select-device:
    name: "Stage 5 - Select Device"
    runs-on: ubuntu-latest
    needs: device-list

    outputs:
      device: ${{ steps.select.outputs.device }}

    steps:

      - name: Download device list
        uses: actions/download-artifact@v4

        with:
          name: pcloudy-device-list
          path: .


      - name: Select first available Android device
        id: select
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Selecting Device from JSON"
          echo "=========================================="

          echo "Available devices:"
          echo ""

          jq -r '
            .result.models[]?
            | select(.available == true)
            | "\(.full_name) | available=\(.available)"
          ' pcloudy-devices.json

          echo ""
          echo "=========================================="
          echo "Selecting first available Android device"
          echo "=========================================="

          DEVICE="$(
            jq -r '
              .result.models[]?
              | select(
                  .available == true
                  and (.platform | ascii_downcase) == "android"
                )
              | .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"

          if [ -z "$DEVICE" ]; then
            echo "ERROR: No available Android device found"
            exit 1
          fi

          echo "Selected device:"
          echo "$DEVICE"

          echo "$DEVICE" > selected-device.txt

          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Upload selected device
        uses: actions/upload-artifact@v4

        with:
          name: selected-device
          path: selected-device.txt


  # ========================================================
  # STAGE 6
  # Upload APK to pCloudy
  # ========================================================

  upload-apk:
    name: "Stage 6 - Upload APK to pCloudy"
    runs-on: ubuntu-latest
    needs:
      - firebase
      - select-device

    steps:

      - name: Download Firebase APK
        uses: actions/download-artifact@v4

        with:
          name: firebase-apk
          path: firebase


      - name: Upload APK to pCloudy
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Firebase APK to pCloudy"
          echo "=========================================="

          if [ ! -s firebase/firebase-app.apk ]; then
            echo "ERROR: Firebase APK not found"
            exit 1
          fi

          AUTH_RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          TOKEN="$(echo "$AUTH_RESPONSE" | jq -r '.result.token // empty')"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not get pCloudy token"
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase/firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "pCloudy upload HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: pCloudy APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "APK uploaded to pCloudy successfully"

      - name: Upload pCloudy upload response
        uses: actions/upload-artifact@v4

        with:
          name: pcloudy-upload
          path: pcloudy-upload.json


  # ========================================================
  # STAGE 7
  # Python + Appium dependencies
  # ========================================================

  appium-dependencies:
    name: "Stage 7 - Appium Dependencies"
    runs-on: ubuntu-latest
    needs: upload-apk

    steps:

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      - name: Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Installing Appium dependencies"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # Required for --html and --self-contained-html
          pip install \
            Appium-Python-Client \
            selenium \
            pytest \
            pytest-html

          echo ""
          echo "Installed packages:"
          pip list


  # ========================================================
  # STAGE 8
  # Run Appium lifecycle test
  # ========================================================

  appium-test:
    name: "Stage 8 - Appium Lifecycle Test"
    runs-on: ubuntu-latest
    needs:
      - select-device
      - upload-apk
      - appium-dependencies

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"


      - name: Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            Appium-Python-Client \
            selenium \
            pytest \
            pytest-html


      - name: Download selected device
        uses: actions/download-artifact@v4

        with:
          name: selected-device
          path: .


      - name: Run Appium lifecycle test
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          APP_PACKAGE: com.epam.mobitru

        run: |
          set -euo pipefail

          PCLOUDY_DEVICE="$(cat selected-device.txt)"

          export PCLOUDY_DEVICE

          echo "=========================================="
          echo "Starting Appium lifecycle test"
          echo "=========================================="

          echo "Device : $PCLOUDY_DEVICE"
          echo "Package: $APP_PACKAGE"
          echo "App    : firebase-app.apk"

          echo "=========================================="

          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml \
            --html=appium-report.html \
            --self-contained-html

          echo ""
          echo "=========================================="
          echo "Appium lifecycle test completed successfully"
          echo "=========================================="


      # ------------------------------------------
      # Upload Appium results
      # ------------------------------------------

      - name: Upload Appium test results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: appium-results
          path: |
            appium-results.xml
            appium-report.html
            selected-device.txt
          if-no-files-found: warn


  # ========================================================
  # STAGE 9
  # Final Results
  # ========================================================

  results:
    name: "Stage 9 - Final Results"
    runs-on: ubuntu-latest
    needs: appium-test
    if: always()

    steps:

      - name: Download Appium results
        uses: actions/download-artifact@v4

        with:
          name: appium-results
          path: results


      - name: Display final result
        shell: bash

        run: |
          echo "=========================================="
          echo "Task 4 Final Result"
          echo "=========================================="

          if [ -f results/selected-device.txt ]; then
            echo "Device:"
            cat results/selected-device.txt
          fi

          echo ""

          if [ -f results/appium-results.xml ]; then
            echo "JUnit result:"
            echo "appium-results.xml available"
          fi

          if [ -f results/appium-report.html ]; then
            echo "HTML report:"
            echo "appium-report.html available"
          fi

          echo ""
          echo "=========================================="
          echo "Results are available in GitHub Actions Artifacts"
          echo "=========================================="


      - name: Upload final Task 4 results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: Task-4-final-results
          path: results/
          if-no-files-found: warn
