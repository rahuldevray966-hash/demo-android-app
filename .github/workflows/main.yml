name: Android CI - Firebase to pCloudy Appium

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # ============================================================
  # JOB 1 - Firebase
  # ============================================================

  firebase:

    name: Stage 1 - Firebase APK

    runs-on: ubuntu-latest

    outputs:
      download_url: ${{ steps.firebase-release.outputs.download_url }}

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Firebase Authentication
      # --------------------------------------------------------

      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2

        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # --------------------------------------------------------
      # Get Firebase Access Token
      # --------------------------------------------------------

      - name: Get Firebase access token
        id: firebase-token

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting Firebase access token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # --------------------------------------------------------
      # Get Latest Firebase Release
      # --------------------------------------------------------

      - name: Get latest Firebase release
        id: firebase-release

        shell: bash

        env:

          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}

          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting latest Firebase Android release"
          echo "=========================================="

          PROJECT_NUMBER="$(printf '%s' "$FIREBASE_PROJECT_NUMBER" | tr -d '[:space:]')"

          APP_ID="$(printf '%s' "$FIREBASE_APP_ID" | tr -d '[:space:]')"


          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi


          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi


          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi


          if [[ "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID does not look like an Android Firebase App ID"
            exit 1
          fi


          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi


          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"


          echo "Calling Firebase App Distribution API..."


          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"


          printf '%s\n' "$RESPONSE" > firebase-release.json


          DOWNLOAD_URL="$(
            echo "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"


          RELEASE_NAME="$(
            echo "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"


          if [ -z "$DOWNLOAD_URL" ]; then

            echo "ERROR: No Firebase Android release found"

            echo ""
            echo "Firebase response:"
            cat firebase-release.json

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "Firebase release found"
          echo "=========================================="

          echo "Release: $RELEASE_NAME"

          echo "Firebase APK download URL found"


          echo "::add-mask::$DOWNLOAD_URL"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Download APK
      # --------------------------------------------------------

      - name: Download Firebase APK

        env:

          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Downloading Firebase APK"
          echo "=========================================="

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 3 \
            --output firebase-app.apk \
            "$DOWNLOAD_URL"


          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi


          ls -lh firebase-app.apk


      # --------------------------------------------------------
      # Verify APK
      # --------------------------------------------------------

      - name: Verify Firebase APK

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Verifying APK"
          echo "=========================================="

          file firebase-app.apk


          SIZE="$(stat -c%s firebase-app.apk)"


          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi


          echo "APK size: ${SIZE} bytes"

          echo "APK verification successful"


      # --------------------------------------------------------
      # Store APK
      # --------------------------------------------------------

      - name: Store APK for next job

        uses: actions/upload-artifact@v4

        with:

          name: firebase-apk

          path: |
            firebase-app.apk
            firebase-release.json


  # ============================================================
  # JOB 2 - pCloudy Setup
  # ============================================================

  pcloudy:

    name: Stage 2 - pCloudy Setup

    runs-on: ubuntu-latest

    needs:
      - firebase

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download APK
      # --------------------------------------------------------

      - name: Download Firebase APK artifact

        uses: actions/download-artifact@v4

        with:
          name: firebase-apk


      # --------------------------------------------------------
      # pCloudy Authentication
      # --------------------------------------------------------

      - name: Authenticate with pCloudy

        id: pcloudy-auth

        env:

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Authenticating with pCloudy"
          echo "=========================================="


          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"


          printf '%s\n' "$RESPONSE" > pcloudy-auth.json


          TOKEN="$(
            echo "$RESPONSE" |
            jq -r '.result.token // empty'
          )"


          if [ -z "$TOKEN" ]; then

            echo "ERROR: pCloudy authentication failed"

            cat pcloudy-auth.json

            exit 1

          fi


          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # --------------------------------------------------------
      # Get Available Android Devices
      # --------------------------------------------------------

      - name: Get available Android devices

        id: device-list

        env:

          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Getting pCloudy Android devices"
          echo "=========================================="


          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${PCLOUDY_TOKEN}\",\"duration\":15,\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices"
          )"


          printf '%s\n' "$RESPONSE" > pcloudy-devices.json


          echo ""
          echo "=========================================="
          echo "Available Android Devices"
          echo "=========================================="


          jq -r '
            .result.models[]?
            | select(.available == true)
            | select((.platform // "" | ascii_downcase) == "android")
            | "\(.full_name) | \(.display_name) | Android \(.version)"
          ' pcloudy-devices.json || true


      # --------------------------------------------------------
      # Select Device
      # --------------------------------------------------------

      - name: Select Android device

        id: selected-device

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Selecting Android device"
          echo "=========================================="


          DEVICE="$(
            jq -r '
              .result.models[]?
              | select(.available == true)
              | select((.platform // "" | ascii_downcase) == "android")
              | select(
                  ((.display_name // "") | ascii_downcase | contains("galaxy s25"))
                  or
                  ((.model // "") | ascii_downcase | contains("galaxys25"))
                )
              | .full_name
            ' pcloudy-devices.json |
            head -n 1
          )"


          if [ -z "$DEVICE" ]; then

            echo "Galaxy S25 is not currently available."

            echo "Selecting first available Android device..."


            DEVICE="$(
              jq -r '
                .result.models[]?
                | select(.available == true)
                | select((.platform // "" | ascii_downcase) == "android")
                | .full_name
              ' pcloudy-devices.json |
              head -n 1
            "

          fi


          if [ -z "$DEVICE" ]; then
            echo "ERROR: No available Android device found"
            exit 1
          fi


          echo ""
          echo "=========================================="
          echo "SELECTED DEVICE"
          echo "=========================================="

          echo "$DEVICE"


          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # Upload APK to pCloudy
      # --------------------------------------------------------

      - name: Upload APK to pCloudy

        env:

          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Uploading APK to pCloudy"
          echo "=========================================="


          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              -o pcloudy-upload.json \
              -w "%{http_code}" \
              --request POST \
              -F "file=@firebase-app.apk" \
              -F "source_type=raw" \
              -F "token=${PCLOUDY_TOKEN}" \
              -F "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"


          echo "pCloudy upload HTTP status: ${HTTP_CODE}"


          if [ "$HTTP_CODE" != "200" ]; then

            echo "ERROR: pCloudy APK upload failed"

            cat pcloudy-upload.json

            exit 1

          fi


          echo "pCloudy APK upload successful"


      # --------------------------------------------------------
      # Store pCloudy setup
      # --------------------------------------------------------

      - name: Store pCloudy setup

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: pcloudy-setup

          path: |
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json


  # ============================================================
  # JOB 3 - Appium
  # ============================================================

  appium:

    name: Stage 3 - Android Appium Test

    runs-on: ubuntu-latest

    needs:
      - firebase
      - pcloudy

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download APK
      # --------------------------------------------------------

      - name: Download Firebase APK

        uses: actions/download-artifact@v4

        with:
          name: firebase-apk


      # --------------------------------------------------------
      # Download pCloudy setup
      # --------------------------------------------------------

      - name: Download pCloudy setup

        uses: actions/download-artifact@v4

        with:
          name: pcloudy-setup


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # --------------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------------

      - name: Install Appium dependencies

        run: |

          set -euo pipefail

          python -m pip install --upgrade pip


          if [ ! -f requirements.txt ]; then

            echo "ERROR: requirements.txt not found"

            exit 1

          fi


          pip install -r requirements.txt


      # --------------------------------------------------------
      # Validate devices.json
      # --------------------------------------------------------

      - name: Validate device configuration

        run: |

          set -euo pipefail


          if [ ! -f devices.json ]; then

            echo "ERROR: devices.json not found"

            exit 1

          fi


          jq empty devices.json


          DEVICE_COUNT="$(
            jq '.devices | length' devices.json
          )"


          if [ "$DEVICE_COUNT" -eq 0 ]; then

            echo "ERROR: No devices configured"

            exit 1

          fi


          echo "Configured devices: $DEVICE_COUNT"

          jq -r '.devices[]' devices.json


      # --------------------------------------------------------
      # Run Appium Lifecycle Test
      # --------------------------------------------------------

      - name: Run Android Appium lifecycle test

        env:

          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}

          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

          PCLOUDY_DEVICE: ${{ steps.selected-device.outputs.device }}

          APP_PACKAGE: com.epam.mobitru

        run: |

          set -euo pipefail

          echo "=========================================="
          echo "Starting Android Appium lifecycle test"
          echo "=========================================="


          echo "Device : $PCLOUDY_DEVICE"

          echo "Package: $APP_PACKAGE"


          if [ -z "$PCLOUDY_DEVICE" ]; then

            echo "ERROR: Selected pCloudy device is empty"

            exit 1

          fi


          pytest \
            automation/test_app_lifecycle.py \
            -v \
            --tb=short \
            --junitxml=appium-results.xml


          echo ""
          echo "=========================================="
          echo "Android Appium lifecycle test completed"
          echo "=========================================="


      # --------------------------------------------------------
      # Upload Results
      # --------------------------------------------------------

      - name: Upload test results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: android-appium-test-results

          path: |
            appium-results.xml
            firebase-release.json
            firebase-app.apk
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json

          if-no-files-found: warn
